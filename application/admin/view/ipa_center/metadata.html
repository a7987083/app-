<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        <div class="panel-lead"><em>IPA 元数据</em>当前工作集只展示被启用 MySQL 软件源引用的 IPA；HTTP Range 只读取 ZIP Central Directory、Info.plist 和必要的小文件，不完整下载 IPA。</div>
    </div>
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <div class="btn-group ipa-meta-filter">
                <button type="button" class="btn btn-primary" data-state="">全部</button>
                <button type="button" class="btn btn-default" data-state="success">已解析</button>
                <button type="button" class="btn btn-default" data-state="pending">待解析</button>
                <button type="button" class="btn btn-default" data-state="failed">失败</button>
            </div>
            <button type="button" class="btn btn-success btn-ipa-parse"><i class="fa fa-play"></i> 后台解析 1 个</button>
            <button type="button" class="btn btn-default btn-ipa-meta-refresh"><i class="fa fa-refresh"></i> 刷新</button>
            <input type="text" id="ipa-meta-search" class="form-control" style="display:inline-block;width:260px" placeholder="IPA / Bundle ID / 应用名">
            <span id="ipa-meta-refresh-state" class="text-muted" style="margin-left:10px"></span>
        </div>
        <div class="alert alert-info" style="margin-top:15px">Parser 优先复用相同 MD5 + 文件大小 + Parser Version 的已解析结果；只有缓存未命中才发起 Range 请求。失败默认 30 分钟后重试，最多 3 次。刷新失败时会明确标记当前表格为旧数据。</div>
        <table id="ipa-meta-table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
<script>
require(['jquery'],function($){
    var text=function(message,failed){$('#ipa-meta-refresh-state').toggleClass('text-danger',!!failed).toggleClass('text-muted',!failed).text(message);};
    $(function(){
        var table=$('#ipa-meta-table');
        table.on('load-success.bs.table.ipaMetaFresh',function(){var d=new Date();text('最后成功刷新：'+d.toLocaleTimeString(),false);});
        table.on('load-error.bs.table.ipaMetaFresh',function(){text('刷新失败，当前显示的是上一次成功加载的旧数据',true);});
        $('.btn-ipa-meta-refresh,.ipa-meta-filter button').on('click.ipaMetaFresh',function(){text('正在刷新…',false);});
        $('#ipa-meta-search').on('change.ipaMetaFresh keyup.ipaMetaFresh',function(e){if(e.type==='change'||e.keyCode===13)text('正在刷新…',false);});
    });
});
</script>
