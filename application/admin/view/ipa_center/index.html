<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        <div class="panel-lead">
            <em>IPA 管理中心</em>
            FastAdmin 管理界面；统计、任务、绑定与治理状态均来自实时数据。
        </div>
    </div>
    <div class="panel-body">
        <div class="row ipa-stat-row">
            <div class="col-sm-3"><div class="well"><strong>IPA 总数</strong><div class="ipa-stat-value" id="ipa-dashboard-total">-</div></div></div>
            <div class="col-sm-3"><div class="well"><strong>已解析</strong><div class="ipa-stat-value" id="ipa-dashboard-parsed">-</div></div></div>
            <div class="col-sm-3"><div class="well"><strong>待解析 / 失败</strong><div class="ipa-stat-value"><span id="ipa-dashboard-pending">-</span> / <span id="ipa-dashboard-failed">-</span></div></div></div>
            <div class="col-sm-3"><div class="well"><strong>已绑定 / 未绑定</strong><div class="ipa-stat-value"><span id="ipa-dashboard-bound">-</span> / <span id="ipa-dashboard-unbound">-</span></div></div></div>
        </div>
        <div class="row">
            <div class="col-sm-4">
                <div class="panel panel-default">
                    <div class="panel-heading"><strong>OpenList 状态</strong></div>
                    <div class="panel-body">
                        <p>配置：<span id="ipa-dashboard-source-configured" class="label label-default">读取中</span></p>
                        <p>健康：<span id="ipa-dashboard-health">-</span></p>
                        <p>最后检查：<span id="ipa-dashboard-checked">-</span></p>
                        <p>最后扫描：<span id="ipa-dashboard-scanned">-</span></p>
                    </div>
                </div>
            </div>
            <div class="col-sm-8">
                <div class="panel panel-default">
                    <div class="panel-heading clearfix">
                        <strong>最近扫描任务</strong>
                        <button type="button" class="btn btn-xs btn-default pull-right btn-ipa-dashboard-refresh"><i class="fa fa-refresh"></i> 刷新</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered table-hover" id="ipa-dashboard-task-table"></table>
                    </div>
                </div>
            </div>
        </div>
        <div class="alert alert-info">治理异常：<strong id="ipa-dashboard-governance">-</strong>。列表页统一使用 FastAdmin BootstrapTable；设置页统一使用 FastAdmin Form。</div>
    </div>
</div>
