<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="alert alert-info">软件源默认只读。只有明确开启“允许字段写回”后，异常预览页才允许人工勾选字段写回；系统不会自动修改目标数据库。</div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">名称</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[name]" data-rule="required" type="text"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Slug</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[slug]" data-rule="required" type="text" placeholder="例如 app2"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">MySQL Host</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[host]" data-rule="required" type="text" value="127.0.0.1"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Port</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[port]" type="number" min="1" max="65535" value="3306"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Database</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[database_name]" data-rule="required" type="text"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Username</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[username]" data-rule="required" type="text"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Password</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[password]" data-rule="required" type="password" autocomplete="new-password"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">应用表</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[table_name]" type="text" value="fa_category"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">优先级</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[priority]" type="number" value="100"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">启用</label><div class="col-xs-12 col-sm-8">{:build_radios('row[enabled]', ['1'=>'是','0'=>'否'], '1')}</div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">允许字段写回</label><div class="col-xs-12 col-sm-8">{:build_radios('row[allow_write]', ['1'=>'允许','0'=>'只读'], '0')}<p class="help-block">建议保持“只读”，需要修复异常时再临时开启。</p></div></div>
    <div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button><button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button></div></div>
</form>
