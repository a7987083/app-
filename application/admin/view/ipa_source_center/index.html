<div class="panel panel-default panel-intro">
    <div class="panel-heading">{:build_heading(null,FALSE)}</div>
    <div class="panel-body">
        <div class="alert alert-info">软件源默认只读。只有明确开启“允许字段写回”后，IPA 异常预览页才允许人工勾选字段写回；系统不会自动修改目标数据库。</div>
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-success btn-add" title="新增软件源"><i class="fa fa-plus"></i> 新增软件源</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled" title="删除"><i class="fa fa-trash"></i> 删除</a>
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fa fa-refresh"></i> 刷新</a>
        </div>
        <table id="mysql-source-table" class="table table-striped table-bordered table-hover table-nowrap"
               data-operate-edit="1" data-operate-del="1"></table>
    </div>
</div>
