<div class="panel panel-default panel-intro">
    <div class="panel-heading">{:build_heading(null,FALSE)}</div>
    <div class="panel-body">
        <div class="alert alert-info">软件源默认只读。只有明确开启“允许字段写回”后，IPA 异常预览页才允许人工勾选字段写回；不会自动修改数据库。</div>
        <div class="panel panel-default">
            <div class="panel-heading"><strong>新增 / 编辑 MySQL 软件源</strong></div>
            <div class="panel-body">
                <form id="mysql-source-form" class="form-horizontal">
                    <input type="hidden" name="id" value="0">
                    <div class="row">
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">名称</label><div class="col-sm-9"><input class="form-control" name="name" required></div></div></div>
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">Slug</label><div class="col-sm-9"><input class="form-control" name="slug" placeholder="例如 app2" required></div></div></div>
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">MySQL Host</label><div class="col-sm-9"><input class="form-control" name="host" value="127.0.0.1" required></div></div></div>
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">Port</label><div class="col-sm-9"><input class="form-control" name="port" type="number" value="3306" min="1" max="65535"></div></div></div>
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">Database</label><div class="col-sm-9"><input class="form-control" name="database_name" required></div></div></div>
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">Username</label><div class="col-sm-9"><input class="form-control" name="username" required></div></div></div>
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">Password</label><div class="col-sm-9"><input class="form-control" name="password" type="password" placeholder="编辑时留空保持原密码"></div></div></div>
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">应用表</label><div class="col-sm-9"><input class="form-control" name="table_name" value="fa_category"></div></div></div>
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">优先级</label><div class="col-sm-9"><input class="form-control" name="priority" type="number" value="100"></div></div></div>
                        <div class="col-sm-6"><div class="form-group"><label class="col-sm-3 control-label">权限</label><div class="col-sm-9"><label class="checkbox-inline"><input type="checkbox" name="enabled" value="1" checked> 启用</label><label class="checkbox-inline"><input type="checkbox" name="allow_write" value="1"> 允许字段写回</label></div></div></div>
                    </div>
                    <div class="text-right"><button type="button" class="btn btn-default hide" id="mysql-source-cancel">取消编辑</button> <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 保存软件源</button></div>
                </form>
            </div>
        </div>
        <div class="panel panel-default">
            <div class="panel-heading"><strong>已配置软件源</strong></div>
            <div class="panel-body"><table id="mysql-source-table"></table></div>
        </div>
    </div>
</div>
