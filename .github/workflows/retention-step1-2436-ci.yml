name: Retention Step1 2436 CI

on:
  push:
    branches:
      - work/2026092436-retention-step1
  workflow_dispatch:

jobs:
  retention-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
      - name: PHP syntax
        run: |
          php -l application/admin/command/IpaMaintenance.php
          php -l tests/phase2436_retention_step1_contract_test.php
      - name: Retention contract
        run: php tests/phase2436_retention_step1_contract_test.php

  mysql57-retention-indexes:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: retention_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Create retention index fixtures
        run: |
          mysql -h127.0.0.1 -uroot -proot retention_test <<'SQL'
          CREATE TABLE fa_ipa_scan_job (
            id bigint unsigned NOT NULL AUTO_INCREMENT,
            status varchar(24) NOT NULL DEFAULT 'pending',
            updated_at int unsigned NOT NULL DEFAULT '0',
            PRIMARY KEY (id)
          ) ENGINE=InnoDB;
          CREATE TABLE fa_authorization_event (
            id int unsigned NOT NULL AUTO_INCREMENT,
            addtime int NOT NULL DEFAULT '0',
            PRIMARY KEY (id)
          ) ENGINE=InnoDB;
          CREATE TABLE fa_admin_log (
            id int unsigned NOT NULL AUTO_INCREMENT,
            createtime int DEFAULT NULL,
            PRIMARY KEY (id)
          ) ENGINE=InnoDB;
          CREATE TABLE fa_ipa_asset (
            id bigint unsigned NOT NULL AUTO_INCREMENT,
            status varchar(32) NOT NULL DEFAULT 'discovered',
            updated_at int unsigned NOT NULL DEFAULT '0',
            PRIMARY KEY (id)
          ) ENGINE=InnoDB;
          CREATE TABLE fa_card_transfer_log (
            id int unsigned NOT NULL AUTO_INCREMENT,
            addtime int NOT NULL DEFAULT '0',
            PRIMARY KEY (id)
          ) ENGINE=InnoDB;
          SQL
      - name: Apply retention indexes twice
        run: |
          mysql -h127.0.0.1 -uroot -proot retention_test < release/sql/2026092436_retention_indexes.sql
          mysql -h127.0.0.1 -uroot -proot retention_test < release/sql/2026092436_retention_indexes.sql
      - name: Verify retention indexes
        run: |
          test "$(mysql -N -h127.0.0.1 -uroot -proot retention_test -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='retention_test' AND table_name='fa_ipa_scan_job' AND index_name='idx_retention_status_updated'")" -gt 0
          test "$(mysql -N -h127.0.0.1 -uroot -proot retention_test -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='retention_test' AND table_name='fa_authorization_event' AND index_name='idx_addtime'")" -gt 0
          test "$(mysql -N -h127.0.0.1 -uroot -proot retention_test -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='retention_test' AND table_name='fa_admin_log' AND index_name='idx_createtime'")" -gt 0
          test "$(mysql -N -h127.0.0.1 -uroot -proot retention_test -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='retention_test' AND table_name='fa_ipa_asset' AND index_name='idx_asset_retention'")" -gt 0
          test "$(mysql -N -h127.0.0.1 -uroot -proot retention_test -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='retention_test' AND table_name='fa_card_transfer_log' AND index_name='idx_addtime'")" -gt 0

  package-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build online update package
        run: |
          php tools/build_online_update.php "$PWD/zonoe-online-update.zip"
          unzip -t zonoe-online-update.zip >/dev/null
      - name: Verify maintenance files are packaged
        run: |
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/admin/command/IpaMaintenance.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/extra/ipa_data_center.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/deploy/systemd/zonoe-ipa-maintenance.service'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/deploy/systemd/zonoe-ipa-maintenance.timer'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'mysql/2026092436_retention_indexes.sql'
