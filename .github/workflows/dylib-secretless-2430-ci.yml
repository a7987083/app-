name: Dylib Secretless Auth 2430 CI

on:
  push:
    branches:
      - feature/2026092430-secretless-from-2428
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php70-contract-and-preservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: openssl, mbstring, zip
      - name: PHP and JS syntax
        run: |
          set -euo pipefail
          php -l application/common/library/Ipa/DylibSigningKey.php
          php -l application/common/library/Ipa/DylibDeviceAuthService.php
          php -l application/common/library/Ipa/DylibVerificationService.php
          php -l application/common/library/Ipa/DylibRuntimeConfigService.php
          php -l application/common/library/Ipa/DylibApiContract.php
          php -l application/common/library/Ipa/DylibApiDocumentation.php
          php -l application/common/library/codegen/ObjectiveCGenerator.php
          php -l application/index/controller/DylibVerify.php
          php -l application/admin/controller/DylibCenter.php
          php -l application/admin/controller/DylibCodegen.php
          php -l application/admin/controller/DylibApiDocs.php
          node --check public/assets/js/backend/dylib_center.js
          node --check public/assets/js/backend/dylib_codegen_inline.js
      - name: Assert Secretless v3 core
        run: |
          set -euo pipefail
          grep -q 'DylibDeviceAuthService::authenticate' application/common/library/Ipa/DylibVerificationService.php
          grep -q 'DylibSigningKey::sign' application/common/library/Ipa/DylibRuntimeConfigService.php
          grep -q 'function challenge' application/index/controller/DylibVerify.php
          grep -q 'device_public_key' clients/ios/ZONDylibVerify/ZONVerifyClient.m
          grep -q 'kSecKeyAlgorithmECDSASignatureMessageX962SHA256' clients/ios/ZONDylibVerify/ZONVerifyClient.m
          grep -q 'kSecKeyAlgorithmRSASignatureMessagePKCS1v15SHA256' clients/ios/ZONDylibVerify/ZONVerifyClient.m
          ! grep -RniE 'verifySecret|CCHmac|hmacSHA256Hex' clients/ios/ZONDylibVerify application/common/library/codegen application/admin/controller/DylibCodegen.php
          ! grep -q 'signing_private_key_ciphertext' application/common/library/Ipa/DylibSigningKey.php
      - name: Assert 2428 feature surface preserved
        run: |
          set -euo pipefail
          for method in versions bindings notices logs saveDylib setDylibEnabled deleteDylib saveVersion deleteVersion saveBinding saveRuntimeConfig saveNotice setNoticeEnabled deleteNotice deleteLogs; do
            grep -q "function ${method}" application/admin/controller/DylibCenter.php || { echo "missing DylibCenter method: ${method}"; exit 1; }
          done
          grep -q '/authorization' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q '/appstore' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q '/index/index/apiface' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q '/index/index/dylib' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q '/unbind' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q '/unbind/query' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q '/index/dylib_verify/config' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q '/index/dylib_verify/challenge' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q 'API_REFERENCE.md' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q 'ERROR_CODES.md' application/common/library/Ipa/DylibApiDocumentation.php
          grep -q 'EXAMPLES.md' application/common/library/codegen/ObjectiveCGenerator.php
          grep -q 'legacy_dylib_urls' application/common/library/codegen/ObjectiveCGenerator.php
          grep -q 'legacy_apiface_urls' application/common/library/codegen/ObjectiveCGenerator.php
          grep -q 'app_update' application/common/library/Ipa/DylibVerificationService.php
          grep -q 'notice' application/common/library/Ipa/DylibVerificationService.php
          grep -q 'dylib_device_session' application/common/library/Ipa/DylibVerificationService.php
      - name: Verify RSA-2048 PHP/OpenSSL support
        run: |
          set -euo pipefail
          php -r '$k=openssl_pkey_new(array("private_key_type"=>OPENSSL_KEYTYPE_RSA,"private_key_bits"=>2048)); if(!$k) exit(1); $d="zonoe-v3"; if(!openssl_sign($d,$s,$k,OPENSSL_ALGO_SHA256)) exit(2); $p=openssl_pkey_get_details($k); if(openssl_verify($d,$s,$p["key"],OPENSSL_ALGO_SHA256)!==1) exit(3); echo "RSA2048_OK\n";'

  mysql57-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zonoe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare 2428 production-like Dylib schema
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -proot zonoe_test <<'SQL'
          CREATE TABLE fa_dylib (
            id bigint unsigned NOT NULL AUTO_INCREMENT,
            dylib_key varchar(128) NOT NULL,
            verify_secret_ciphertext mediumtext NULL,
            PRIMARY KEY(id), UNIQUE KEY uk_dylib_key(dylib_key)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE fa_dylib_runtime_config (
            id int unsigned NOT NULL DEFAULT 1,
            config_version int unsigned NOT NULL DEFAULT 1,
            api_endpoints_json text,
            bootstrap_urls_json text,
            verify_path varchar(255) NOT NULL DEFAULT '/index/dylib_verify/verify',
            updated_at int unsigned NOT NULL DEFAULT 0,
            PRIMARY KEY(id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT INTO fa_dylib_runtime_config(id,config_version,api_endpoints_json,bootstrap_urls_json,verify_path) VALUES(1,2,'[]','[]','/index/dylib_verify/verify');
          CREATE TABLE fa_dylib_nonce(id bigint unsigned NOT NULL AUTO_INCREMENT, nonce_hash char(64) NOT NULL, PRIMARY KEY(id)) ENGINE=InnoDB;
          SQL
      - name: Apply 2430 migration twice
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -proot zonoe_test < release/sql/2026092430_secretless_dylib_auth.sql
          mysql -h127.0.0.1 -uroot -proot zonoe_test < release/sql/2026092430_secretless_dylib_auth.sql
      - name: Assert 2430 schema
        run: |
          set -euo pipefail
          test "$(mysql -N -h127.0.0.1 -uroot -proot zonoe_test -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='zonoe_test' AND table_name='fa_dylib' AND column_name='verify_secret_ciphertext'")" = "0"
          test "$(mysql -N -h127.0.0.1 -uroot -proot zonoe_test -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zonoe_test' AND table_name='fa_dylib_nonce'")" = "0"
          test "$(mysql -N -h127.0.0.1 -uroot -proot zonoe_test -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zonoe_test' AND table_name='fa_dylib_device_key'")" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot zonoe_test -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zonoe_test' AND table_name='fa_dylib_auth_challenge'")" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot zonoe_test -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='zonoe_test' AND table_name='fa_dylib_runtime_config' AND column_name='signing_private_key_ciphertext'")" = "0"
          test "$(mysql -N -h127.0.0.1 -uroot -proot zonoe_test -e "SELECT config_version FROM fa_dylib_runtime_config WHERE id=1")" -ge "3"

  ios13-client-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check Objective-C client on iOS 13 arm64
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -fobjc-arc -fmodules -fsyntax-only -arch arm64 -miphoneos-version-min=13.0 -isysroot "$SDK" clients/ios/ZONDylibVerify/ZONVerifyClient.m

  update-package-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: zip
      - name: Assert update manifest contains 2430 files
        run: |
          set -euo pipefail
          grep -Fx 'application/common/library/Ipa/DylibDeviceAuthService.php' release/online-update-files.txt
          grep -Fx 'application/common/library/Ipa/DylibSigningKey.php' release/online-update-files.txt
          grep -Fx 'application/admin/controller/DylibCenter.php' release/online-update-files.txt
          grep -Fx 'application/common/library/Ipa/DylibApiDocumentation.php' release/online-update-files.txt
          grep -Fx 'clients/ios/ZONDylibVerify/ZONVerifyClient.m' release/online-update-files.txt
      - name: Build and inspect online update package
        run: |
          set -euo pipefail
          php -l tools/build_online_update.php
          php tools/build_online_update.php "$PWD/zonoe-online-update.zip"
          unzip -t zonoe-online-update.zip >/dev/null
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/common/library/Ipa/DylibDeviceAuthService.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/common/library/Ipa/DylibSigningKey.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/admin/controller/DylibCenter.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/common/library/Ipa/DylibApiDocumentation.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/clients/ios/ZONDylibVerify/ZONVerifyClient.m'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'mysql/2026092430_secretless_dylib_auth.sql'
