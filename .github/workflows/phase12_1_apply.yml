name: Phase12.1 Apply Payload

on:
  push:
    branches:
      - feature/phase12.1-hotfix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified Phase 12.1 payload
        run: |
          set -euo pipefail
          if [ ! -f tools/phase12_1_payload.ready ]; then
            echo "Phase 12.1 payload not ready"
            exit 0
          fi
          cat tools/phase12_1_chunks/chunk_00 tools/phase12_1_chunks/chunk_01 tools/phase12_1_chunks/chunk_02 tools/phase12_1_chunks/chunk_03 tools/phase12_1_chunks/chunk_04 tools/phase12_1_chunks/chunk_05 tools/phase12_1_chunks/chunk_06 tools/phase12_1_chunks/chunk_07 > /tmp/phase12_1_payload.b64
          python3 - <<'PY'
          import base64, pathlib
          b = pathlib.Path('/tmp/phase12_1_payload.b64').read_bytes()
          if len(b) != 45428:
              raise SystemExit('unexpected base64 length: %d' % len(b))
          pathlib.Path('/tmp/phase12_1_payload.tar.gz').write_bytes(base64.b64decode(b, validate=True))
          PY
          echo "a4cca36a9e00b8a1a97bafae661da06f72d0d6e9d544212e77b99b1cf5c417c8  /tmp/phase12_1_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/phase12_1_payload.tar.gz -C .
          rm -rf tools/phase12_1_chunks tools/phase12_1_payload.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/regression.yml application/common/library/update/UpdateManager.php application/common/library/AuthorizationSchema.php application/common/library/AuthorizationPolicy.php application/common/library/CardDeviceTransfer.php application/index/controller/App.php application/admin/controller/Kami.php application/admin/controller/Authorization.php application/admin/view/kami/add.html application/admin/view/kami/edit.html application/index/view/index/unbind.html application/admin/view/authorization/index.html application/admin/view/authorization/transfers.html tools/phase11_upgrade.sql tools/phase12_1_upgrade.sql tests/authorization_policy_test.php tests/card_device_transfer_contract_test.php tests/phase11_contract_test.php tests/phase12_update_contract_test.php ver.json public/update/ver.txt PHASE12_1_RELEASE.txt PROJECT_STATE.json CHANGELOG_DEV.md HANDOFF.md KNOWN_ISSUES.md tools/phase12_1_chunks tools/phase12_1_payload.ready
          git commit -m "phase12.1: fix updater diagnostics and editable transfer quota"
          git push origin HEAD:feature/phase12.1-hotfix
