            application/admin/command/Install/phase20_ipa_binding.sql
            application/admin/command/Install/phase20_ipa_writeback.sql
            application/admin/command/Install/phase20_ipa_governance.sql
            application/admin/command/Install/phase20_ipa_production.sql
            application/admin/command/Install/phase20_ipa_lifecycle.sql
          if-no-files-found: error
          retention-days: 30

  e2e-online-upgrade:
    needs: package-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: curl, zip
      - name: Resolve previous stable release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package-and-release.outputs.version }}
        run: |
          set -euo pipefail
          OLD="$(gh release list --limit 50 --json tagName --jq '.[].tagName' | sed -n 's/^source-v\([0-9][0-9]*\)$/\1/p' | awk -v target="$VERSION" '$1 < target' | sort -n | tail -1)"
          if [ -z "$OLD" ]; then OLD=0; fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "previous release version: $OLD"
      - name: Real GitHub Release online-update E2E
        env:
          ZONOE_E2E_OLD_VERSION: ${{ steps.previous.outputs.old }}
        run: |
          set -euo pipefail
          php tests/phase13_github_online_update_e2e.php
