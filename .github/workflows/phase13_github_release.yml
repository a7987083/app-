          test -s zonoe-online-update.zip.sha256
      - name: Publish or refresh stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TAG="source-v${VERSION}"
          TITLE="ZONOE 软件源 ${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" zonoe-online-update.zip zonoe-online-update.zip.sha256 --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release/RELEASE_NOTES.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" zonoe-online-update.zip zonoe-online-update.zip.sha256 \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release/RELEASE_NOTES.md
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url
      - name: Upload CI copy of release assets
        uses: actions/upload-artifact@v4
        with:
          name: zonoe-source-${{ steps.meta.outputs.version }}-online-update
          path: |
            zonoe-online-update.zip
            zonoe-online-update.zip.sha256
            release/RELEASE_NOTES.md
            release/online-update-files.txt
            release/sql/2026091611_card_scope.sql
