name: ZONOE Source Release

on:
  push:
    branches:
      - feature/phase13-github-release
      - feature/phase17-2-auth-integrity-v1
      - feature/phase17-3-renewal-entry-v1
      - hotfix/phase17-4-admin-actions-v1
      - feature/phase17-5-mapping-cleanup-v1
      - 'release/**'
    paths:
      - 'VERSION'
      - 'public/update/ver.txt'
      - 'ver.json'
      - 'PHASE13_RELEASE.txt'
      - 'RELEASE_POLICY.md'
      - 'release/RELEASE_NOTES.md'
      - 'release/online-update-files.txt'
      - 'release/sql/**'
      - 'tools/build_online_update.php'
      - 'tests/phase13_github_online_update_e2e.php'
      - 'tests/phase13_update_runtime_test.php'
      - 'tests/phase15_data_integrity_contract_test.php'
      - 'tests/phase15_4_ops_slim_contract_test.php'
      - 'tests/card_access_policy_test.php'
      - 'tests/appstore_card_scope_test.php'
      - 'tests/phase16_card_scope_contract_test.php'
      - 'tests/phase16_mysql57_migration_test.php'
      - 'tests/phase17_unlock_signing_contract_test.php'
      - 'tests/phase17_unlock_signing_mysql57_test.php'
      - 'tests/phase17_3_renewal_entry_contract_test.php'
      - 'tests/phase17_3_renewal_entry_mysql57_test.php'
      - 'tests/phase17_4_admin_hotfix_contract_test.php'
      - 'tests/phase17_4_admin_hotfix_mysql57_test.php'
      - 'tests/phase17_5_mapping_cleanup_contract_test.php'
      - 'tests/phase19_2_authorization_center_contract_test.php'
      - 'tests/phase19_2_legacy_response_cache_test.php'
      - 'tests/phase19_3_api_center_performance_test.php'
      - 'tests/phase19_3_mysql57_migration_test.php'
      - 'tests/phase19_3_large_catalog_test.php'
      - 'tests/phase19_3_1_api_center_contract_test.php'
      - 'tests/phase19_3_1_encryption_benchmark.php'
      - 'tests/phase19_3_1_load_result_gate.php'
      - 'tests/phase19_4_dynamic_announcement_test.php'
      - 'tests/phase19_4_1_hotfix_test.php'
      - 'tests/phase19_4_2_unified_announcement_test.php'
      - 'tests/phase20_*'
      - 'tests/phase207_*'
      - 'tests/fixtures/phase20_*'
      - 'tests/fixtures/phase19_3_1_load_schema.sql'
      - 'tests/load/phase19_3_1_http_load.sh'
      - 'tests/load/wrk_metrics.lua'
      - 'application/common/library/ApiEndpointRegistry.php'
      - 'application/common/library/SourceLegacyCache.php'
      - 'application/common/library/SourceAppRepository.php'
      - 'application/common/library/SourcePerformance.php'
      - 'application/common/library/SourceEncryptionProvider.php'
      - 'application/common/library/SourceAnnouncementTemplate.php'
      - 'application/admin/controller/Ipa*.php'
      - 'application/admin/command/Ipa*.php'
      - 'application/admin/command/Install/phase20_ipa_*.sql'
      - 'application/admin/view/ipa_center/**'
      - 'application/common/library/Ipa*.php'
      - 'public/assets/js/backend/ipa*.js'
      - 'scripts/ipa-range-info.py'
      - 'application/route.php'
      - 'public/assets/js/backend/general/config.js'
      - 'application/index/controller/ManagedApi.php'
      - 'application/admin/view/general/config/index.html'
      - '.github/workflows/phase13_github_release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zonoe-source-release
  cancel-in-progress: false

jobs:
  php70-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: curl, zip
      - name: Lint release and updater files
        run: |
          set -euo pipefail
          php -l tools/build_online_update.php
          php -l tests/phase13_github_online_update_e2e.php
          php -l tests/phase13_update_runtime_test.php
          php -l tests/phase15_data_integrity_contract_test.php
          php -l tests/phase15_4_ops_slim_contract_test.php
          php -l tests/card_access_policy_test.php
          php -l tests/appstore_card_scope_test.php
          php -l tests/phase16_card_scope_contract_test.php
          php -l tests/phase16_mysql57_migration_test.php
          php -l tests/phase17_unlock_signing_contract_test.php
          php -l tests/phase17_unlock_signing_mysql57_test.php
          php -l tests/phase17_3_renewal_entry_contract_test.php
          php -l tests/phase17_3_renewal_entry_mysql57_test.php
          php -l tests/phase17_4_admin_hotfix_contract_test.php
          php -l tests/phase17_4_admin_hotfix_mysql57_test.php
          php -l tests/phase17_5_mapping_cleanup_contract_test.php
          php -l tests/phase19_2_authorization_center_contract_test.php
          php -l tests/phase19_2_legacy_response_cache_test.php
          php -l tests/phase19_3_api_center_performance_test.php
          php -l tests/phase19_3_mysql57_migration_test.php
          php -l tests/phase19_3_large_catalog_test.php
          php -l tests/phase19_3_1_api_center_contract_test.php
          php -l tests/phase19_3_1_encryption_benchmark.php
          php -l tests/phase19_3_1_load_result_gate.php
          php -l tests/phase19_4_dynamic_announcement_test.php
          php -l tests/phase19_4_1_hotfix_test.php
          php -l tests/phase19_4_2_unified_announcement_test.php
          php -l tests/phase20_foundation_contract_test.php
          php -l tests/phase20_ui_contract_test.php
          php -l tests/phase20_scan_planner_test.php
          php -l tests/phase20_scan_contract_test.php
          php -l tests/phase20_metadata_normalizer_test.php
          php -l tests/phase20_parser_contract_test.php
          php -l tests/phase20_binding_contract_test.php
          php -l tests/phase20_binding_ui_contract_test.php
          php -l tests/phase20_writeback_contract_test.php
          php -l tests/phase20_governance_contract_test.php
          php -l tests/phase207_production_contract_test.php
          php -l tests/phase207_metrics_retention_contract_test.php
          php -l tests/phase207_lifecycle_contract_test.php
          php -l tests/phase20_rc_release_contract_test.php
          php -l tests/phase20_openlist_http_e2e.php
          php -l tests/phase20_update_rollback_e2e.php
          php -l tests/fixtures/phase20_openlist_mock_router.php
          bash -n tests/load/phase19_3_1_http_load.sh
          php -l application/common/library/update/UpdateRuntimeStore.php
          php -l application/common/library/update/UpdateInstaller.php
          php -l application/common/library/update/UpdateManager.php
          php -l application/common/library/update/UpdateOps.php
          php -l application/common/library/CardAccessPolicy.php
          php -l application/common/library/CardDeviceTransfer.php
          php -l application/common/library/AppStorePayload.php
          php -l application/common/library/SourceAppRecord.php
          php -l application/common/library/ApiEndpointRegistry.php
          php -l application/common/library/SourceLegacyCache.php
          php -l application/common/library/SourceAppRepository.php
          php -l application/common/library/SourcePerformance.php
          php -l application/common/library/SourceEncryptionProvider.php
          php -l application/common/library/SourceAnnouncementTemplate.php
          php -l application/index/controller/ManagedApi.php
          php -l application/common/library/AuthorizationSchema.php
          php -l application/common/library/DataIntegrityAudit.php
          php -l application/index/controller/App.php
          php -l application/index/controller/Index.php
          php -l application/admin/controller/Kami.php
          php -l application/admin/controller/Authorization.php
          php -l application/admin/controller/Category.php
          php -l application/admin/model/Kami.php
          php -l application/common/model/Category.php
          php -l application/admin/controller/Integrity.php
          php -l application/admin/controller/general/Config.php
          php -l application/admin/controller/general/Updatemaintenance.php
          for f in application/admin/controller/Ipa*.php application/admin/command/Ipa*.php application/common/library/Ipa*.php; do php -l "$f"; done
          node --check public/assets/js/backend/kami.js
          node --check public/assets/js/backend/general/updatemaintenance.js
          node --check public/assets/js/backend/general/config.js
          node --check public/assets/js/backend/ipa_center.js
          node --check public/assets/js/backend/ipa_governance_production.js
      - name: Verify source integrity manifest
        run: |
          set -euo pipefail
          SIGN="$(php -r "require 'application/common/library/UpdateIntegrity.php'; echo app\\common\\library\\UpdateIntegrity::signFromRoot(getcwd());")"
          MANIFEST_SIGN="$(php -r '$j=json_decode(file_get_contents("ver.json"), true); echo isset($j["file_sign"]) ? $j["file_sign"] : "";')"
          echo "SOURCE_FILE_SIGN=$SIGN"
          test -n "$MANIFEST_SIGN"
          test "$SIGN" = "$MANIFEST_SIGN"
      - name: Run full PHP 7.0 regression
        run: |
          set -euo pipefail
          php tests/card_access_policy_test.php
          php tests/appstore_card_scope_test.php
          php tests/phase16_card_scope_contract_test.php
          php tests/phase17_unlock_signing_contract_test.php
          php tests/phase17_3_renewal_entry_contract_test.php
          php tests/phase17_4_admin_hotfix_contract_test.php
          php tests/phase17_5_mapping_cleanup_contract_test.php
          php tests/phase19_2_authorization_center_contract_test.php
          php tests/phase19_2_legacy_response_cache_test.php
          php tests/phase19_3_api_center_performance_test.php
          php tests/phase19_3_large_catalog_test.php
          php tests/phase19_3_1_api_center_contract_test.php
          php tests/phase19_3_1_encryption_benchmark.php
          php tests/phase19_4_dynamic_announcement_test.php
          php tests/phase19_4_1_hotfix_test.php
          php tests/phase19_4_2_unified_announcement_test.php
          php tests/phase20_foundation_contract_test.php
          php tests/phase20_ui_contract_test.php
          php tests/phase20_scan_planner_test.php
          php tests/phase20_scan_contract_test.php
          python3 scripts/ipa-range-info.py --self-test
          php tests/phase20_metadata_normalizer_test.php
          php tests/phase20_parser_contract_test.php
          php tests/phase20_binding_contract_test.php
          php tests/phase20_binding_ui_contract_test.php
          php tests/phase20_writeback_contract_test.php
          php tests/phase20_governance_contract_test.php
          php tests/phase207_production_contract_test.php
          php tests/phase207_metrics_retention_contract_test.php
          php tests/phase207_lifecycle_contract_test.php
          php tests/phase20_rc_release_contract_test.php
          php tests/source_encryption_provider_test.php
          php tests/source_encryption_bkey_cache_test.php
          php tests/source_encryption_policy_test.php
          php tests/phase18_2_encryption_mode_contract_test.php
          php tests/appstore_payload_test.php
          php tests/appstore_equivalence_test.php
          php tests/appstore_semantic_equivalence_test.php
          php tests/source_app_record_test.php
          php tests/source_http_client_contract_test.php
          php tests/source_response_test.php
          php tests/source_config_repository_test.php
          php tests/blacklist_policy_test.php
          php tests/blacklist_persistence_contract_test.php
          php tests/blacklist_maintenance_test.php
          php tests/trace_monitor_policy_test.php
          php tests/trace_monitor_contract_test.php
          php tests/category_listing_contract_test.php
          php tests/category_daily_stat_test.php
          php tests/category_statistics_contract_test.php
          php tests/card_code_generator_test.php
          php tests/card_maintenance_contract_test.php
          php tests/card_entitlement_policy_test.php
          php tests/card_device_transfer_contract_test.php
          php tests/phase10_controller_contract_test.php
          php tests/authorization_policy_test.php
          php tests/phase11_contract_test.php
          php tests/phase12_update_contract_test.php
          php tests/phase13_update_runtime_test.php
          php tests/phase14_update_ops_test.php
          php tests/phase14_update_ops_ui_contract_test.php
          php tests/phase15_data_integrity_contract_test.php
          php tests/phase15_4_ops_slim_contract_test.php
          php tests/legacy_controller_contract_test.php
          bash tests/legacy_controller_audit_test.sh
          php tests/deployment_contract_test.php

  mysql57-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zonoe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: mysqli
      - name: Run real MySQL 5.7 migrations twice
        env:
          ZONOE_MYSQL_HOST: 127.0.0.1
          ZONOE_MYSQL_PORT: 3306
          ZONOE_MYSQL_USER: root
          ZONOE_MYSQL_PASSWORD: root
          ZONOE_MYSQL_DATABASE: zonoe_test
        run: |
          set -euo pipefail
          php -l tests/phase16_mysql57_migration_test.php
          php tests/phase16_mysql57_migration_test.php
          php -l tests/phase17_unlock_signing_mysql57_test.php
          php tests/phase17_unlock_signing_mysql57_test.php
          php -l tests/phase17_3_renewal_entry_mysql57_test.php
          php tests/phase17_3_renewal_entry_mysql57_test.php
          php -l tests/phase17_4_admin_hotfix_mysql57_test.php
          php tests/phase17_4_admin_hotfix_mysql57_test.php
          php -l tests/phase19_3_mysql57_migration_test.php
          php tests/phase19_3_mysql57_migration_test.php
          mysql -h127.0.0.1 -P3306 -uroot -proot zonoe_test <<'SQL'
          CREATE TABLE IF NOT EXISTS `fa_auth_rule` (
            `id` int(10) unsigned NOT NULL AUTO_INCREMENT,
            `type` varchar(20) NOT NULL DEFAULT '',
            `pid` int(10) unsigned NOT NULL DEFAULT '0',
            `name` varchar(100) NOT NULL DEFAULT '',
            `title` varchar(100) NOT NULL DEFAULT '',
            `icon` varchar(50) NOT NULL DEFAULT '',
            `condition` varchar(255) NOT NULL DEFAULT '',
            `remark` varchar(255) NOT NULL DEFAULT '',
            `ismenu` tinyint(1) unsigned NOT NULL DEFAULT '0',
            `createtime` int(10) unsigned NOT NULL DEFAULT '0',
            `updatetime` int(10) unsigned NOT NULL DEFAULT '0',
            `weigh` int(10) NOT NULL DEFAULT '0',
            `status` varchar(30) NOT NULL DEFAULT 'normal',
            PRIMARY KEY (`id`),
            UNIQUE KEY `uniq_name` (`name`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8;
          SQL
          phase20_files=(phase20_ipa_foundation.sql phase20_ipa_center.sql phase20_ipa_scan.sql phase20_ipa_parser.sql phase20_ipa_binding.sql phase20_ipa_writeback.sql phase20_ipa_governance.sql phase20_ipa_production.sql phase20_ipa_lifecycle.sql)
          for pass in 1 2; do
            for name in "${phase20_files[@]}"; do
              mysql -h127.0.0.1 -P3306 -uroot -proot zonoe_test < "application/admin/command/Install/${name}"
            done
          done
          mysql_base=(mysql -N -B -h127.0.0.1 -P3306 -uroot -proot zonoe_test)
          for table in fa_ipa_metadata fa_ipa_binding fa_ipa_scan_task fa_ipa_scan_task_item fa_ipa_governance_issue fa_ipa_operation_log fa_ipa_writeback_rule fa_ipa_source; do
            test "$("${mysql_base[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zonoe_test' AND table_name='${table}'")" = "1"
          done
          test "$("${mysql_base[@]}" -e "SELECT COUNT(*) FROM (SELECT name FROM fa_auth_rule GROUP BY name HAVING COUNT(*) > 1) d")" = "0"
          test "$("${mysql_base[@]}" -e "SELECT COUNT(*) FROM fa_auth_rule WHERE name='ipa_center/governance_batch_apply'")" = "1"
          test "$("${mysql_base[@]}" -e "SELECT COUNT(*) FROM fa_auth_rule WHERE name='ipa_recovery/retry'")" = "1"
          test "$("${mysql_base[@]}" -e "SELECT COUNT(*) FROM fa_auth_rule WHERE name='ipa_production/retention_apply'")" = "1"

  phase19-3-1-http-load:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zonoe_load
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: mysqli, curl, openssl, mbstring, iconv
      - name: Install Phase 19.3.1 HTTP load tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nginx wrk
      - name: Run release-gating /appstore concurrency matrix
        env:
          ZONOE_MYSQL_HOST: 127.0.0.1
          ZONOE_MYSQL_PORT: 3306
          ZONOE_MYSQL_USER: root
          ZONOE_MYSQL_PASSWORD: root
          ZONOE_MYSQL_DATABASE: zonoe_load
          ZONOE_LOAD_SECONDS: 2
          ZONOE_LOAD_RESULT: ${{ github.workspace }}/phase19-3-1-load-results.tsv
        run: |
          set -euo pipefail
          chmod +x tests/load/phase19_3_1_http_load.sh
          tests/load/phase19_3_1_http_load.sh
      - name: Upload release-gating load metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19-3-1-http-load-release-${{ github.run_id }}
          path: |
            phase19-3-1-load-results.tsv
            /tmp/zonoe-phase19-3-1-nginx-error.log
            /tmp/zonoe-php-*.log
          if-no-files-found: warn
          retention-days: 30

  phase20-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: curl, zip
      - name: Run Phase 20 OpenList HTTP E2E
        run: |
          set -euo pipefail
          state="${RUNNER_TEMP}/phase20-openlist-state.json"
          cat > "$state" <<'JSON'
          {"files":{"/games/AppOne.ipa":{"size":111,"modified":1700000001,"etag":"one","md5":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},"/games/nested/AppTwo.IPA":{"size":222,"modified":1700000002,"etag":"two","md5":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},"/games/readme.txt":{"size":3,"modified":1700000003}},"requests":[]}
          JSON
          export PHASE20_OPENLIST_STATE="$state"
          php -S 127.0.0.1:18080 tests/fixtures/phase20_openlist_mock_router.php >"${RUNNER_TEMP}/phase20-openlist.log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null -X POST -H 'Authorization: phase20-test-token' -H 'Content-Type: application/json' --data '{"path":"/"}' http://127.0.0.1:18080/api/fs/list; then break; fi
            sleep 0.2
          done
          PHASE20_OPENLIST_BASE='http://127.0.0.1:18080' PHASE20_OPENLIST_STATE="$state" php tests/phase20_openlist_http_e2e.php
      - name: Run Phase 20 updater rollback E2E
        run: php tests/phase20_update_rollback_e2e.php
      - name: Run legacy updater rollback regression
        run: php tests/phase13_update_runtime_test.php

  package-and-release:
    needs: [php70-regression, mysql57-migration, phase19-3-1-http-load, phase20-integration]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Validate release metadata
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < public/update/ver.txt)"
          ROOT_VERSION="$(tr -d '\r\n ' < VERSION)"
          JSON_VERSION="$(php -r '$j=json_decode(file_get_contents("ver.json"), true); echo isset($j["version"]) ? $j["version"] : "";')"
          [[ "$VERSION" =~ ^20[0-9]{6,12}$ ]]
          test "$ROOT_VERSION" = "$VERSION"
          test "$JSON_VERSION" = "$VERSION"
          grep -F "ZONOE 软件源 ${VERSION}" release/RELEASE_NOTES.md
          grep -F "版本：${VERSION}" PHASE13_RELEASE.txt
          test -s RELEASE_POLICY.md
          grep -F 'UpdateRuntimeStore.php' release/online-update-files.txt
          grep -F 'UpdateInstaller.php' release/online-update-files.txt
          grep -F 'UpdateManager.php' release/online-update-files.txt
          grep -F 'UpdateOps.php' release/online-update-files.txt
          grep -F 'CardAccessPolicy.php' release/online-update-files.txt
          grep -F 'CardDeviceTransfer.php' release/online-update-files.txt
          grep -F 'AppStorePayload.php' release/online-update-files.txt
          grep -F 'SourceAppRecord.php' release/online-update-files.txt
          grep -F 'application/index/controller/App.php' release/online-update-files.txt
          grep -F 'application/index/controller/Index.php' release/online-update-files.txt
          grep -F 'application/index/controller/ManagedApi.php' release/online-update-files.txt
          grep -F 'ApiEndpointRegistry.php' release/online-update-files.txt
          grep -F 'SourceEncryptionProvider.php' release/online-update-files.txt
          grep -F 'public/assets/js/backend/general/config.js' release/online-update-files.txt
          grep -F 'application/admin/view/general/config/index.html' release/online-update-files.txt
          grep -F 'application/admin/controller/Authorization.php' release/online-update-files.txt
          grep -F 'application/admin/controller/Category.php' release/online-update-files.txt
          grep -F 'application/admin/model/Kami.php' release/online-update-files.txt
          grep -F 'application/common/model/Category.php' release/online-update-files.txt
          grep -F 'application/admin/view/authorization/index.html' release/online-update-files.txt
          grep -F 'application/admin/view/authorization/transfers.html' release/online-update-files.txt
          grep -F 'application/admin/view/authorization/events.html' release/online-update-files.txt
          grep -F 'application/admin/view/category/add.html' release/online-update-files.txt
          grep -F 'application/admin/view/category/edit.html' release/online-update-files.txt
          grep -F 'application/admin/controller/Kami.php' release/online-update-files.txt
          grep -F 'application/admin/view/kami/add.html' release/online-update-files.txt
          grep -F 'application/admin/view/kami/edit.html' release/online-update-files.txt
          grep -F 'public/assets/js/backend/kami.js' release/online-update-files.txt
          grep -F 'DataIntegrityAudit.php' release/online-update-files.txt
          grep -F 'Integrity.php' release/online-update-files.txt
          grep -F 'application/admin/controller/IpaCenter.php' release/online-update-files.txt
          grep -F 'application/admin/controller/IpaRecovery.php' release/online-update-files.txt
          grep -F 'application/admin/controller/IpaProduction.php' release/online-update-files.txt
          grep -F 'application/admin/controller/IpaLifecycle.php' release/online-update-files.txt
          grep -F 'application/common/library/IpaGovernanceService.php' release/online-update-files.txt
          grep -F 'application/common/library/IpaGovernanceBatchService.php' release/online-update-files.txt
          grep -F 'application/common/library/IpaGovernanceRecoveryService.php' release/online-update-files.txt
          grep -F 'application/common/library/IpaRangeMetricsService.php' release/online-update-files.txt
