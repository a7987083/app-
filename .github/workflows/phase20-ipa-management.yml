name: Phase 20 IPA Management

on:
  push:
    branches:
      - 'feature/phase20-ipa-management-v1'
  pull_request:
    paths:
      - 'application/admin/controller/IpaCenter.php'
      - 'application/admin/controller/IpaRecovery.php'
      - 'application/admin/command/IpaScan.php'
      - 'application/admin/command/IpaParse.php'
      - 'application/command.php'
      - 'application/admin/view/ipa_center/**'
      - 'application/admin/command/Install/phase20_ipa_*.sql'
      - 'application/common/library/Ipa*.php'
      - 'scripts/ipa-range-info.py'
      - 'public/assets/js/backend/ipa_center.js'
      - 'public/assets/js/backend/ipa_governance_production.js'
      - 'tests/phase20_*'
      - 'tests/phase207_*'
      - '.github/workflows/phase20-ipa-management.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase20-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l application/admin/controller/IpaCenter.php
          php -l application/admin/controller/IpaRecovery.php
          php -l application/admin/command/IpaScan.php
          php -l application/admin/command/IpaParse.php
          php -l application/common/library/IpaFoundation.php
          php -l application/common/library/IpaRemoteFile.php
          php -l application/common/library/IpaScanPlanner.php
          php -l application/common/library/IpaOpenListClient.php
          php -l application/common/library/IpaInventoryCache.php
          php -l application/common/library/IpaSourceConfig.php
          php -l application/common/library/IpaScanService.php
          php -l application/common/library/IpaParserRunner.php
          php -l application/common/library/IpaMetadataNormalizer.php
          php -l application/common/library/IpaParserService.php
          php -l application/common/library/IpaBindingService.php
          php -l application/common/library/IpaWritebackTemplate.php
          php -l application/common/library/IpaGovernanceService.php
          php -l application/common/library/IpaGovernanceBatchService.php
          php -l application/common/library/IpaGovernanceRecoveryService.php
          php -l tests/phase20_foundation_contract_test.php
          php -l tests/phase20_ui_contract_test.php
          php -l tests/phase20_scan_planner_test.php
          php -l tests/phase20_scan_contract_test.php
          php -l tests/phase20_metadata_normalizer_test.php
          php -l tests/phase20_parser_contract_test.php
          php -l tests/phase20_binding_contract_test.php
          php -l tests/phase20_binding_ui_contract_test.php
          php -l tests/phase20_writeback_contract_test.php
          php -l tests/phase20_governance_contract_test.php
          php -l tests/phase207_production_contract_test.php
      - name: Phase 20 foundation contract
        run: php tests/phase20_foundation_contract_test.php
      - name: Phase 20 UI contract
        run: php tests/phase20_ui_contract_test.php
      - name: Phase 20 scan planner
        run: php tests/phase20_scan_planner_test.php
      - name: Phase 20 scan contract
        run: php tests/phase20_scan_contract_test.php
      - name: Phase 20 parser self-test
        run: python3 scripts/ipa-range-info.py --self-test
      - name: Phase 20 metadata normalizer
        run: php tests/phase20_metadata_normalizer_test.php
      - name: Phase 20 parser contract
        run: php tests/phase20_parser_contract_test.php
      - name: Phase 20 binding contract
        run: php tests/phase20_binding_contract_test.php
      - name: Phase 20 binding UI contract
        run: php tests/phase20_binding_ui_contract_test.php
      - name: Phase 20 writeback contract
        run: php tests/phase20_writeback_contract_test.php
      - name: Phase 20 governance contract
        run: php tests/phase20_governance_contract_test.php
      - name: Phase 20.7 production governance contract
        run: php tests/phase207_production_contract_test.php
