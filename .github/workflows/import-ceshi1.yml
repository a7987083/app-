name: One-shot replace with latest source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-ceshi1.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download latest source
        run: |
          set -euo pipefail
          rm -rf /tmp/source-import
          mkdir -p /tmp/source-import/extract /tmp/source-import/source
          curl -fL --retry 3 --retry-delay 2 \
            'https://ios.zonoeios.xyz/1.zip' \
            -o /tmp/source-import/source.zip
          test -s /tmp/source-import/source.zip
          unzip -t /tmp/source-import/source.zip >/dev/null
          sha256sum /tmp/source-import/source.zip

      - name: Extract and validate source
        run: |
          set -euo pipefail
          unzip -q /tmp/source-import/source.zip -d /tmp/source-import/extract
          shopt -s dotglob nullglob
          entries=(/tmp/source-import/extract/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}/." /tmp/source-import/source/
          else
            cp -a /tmp/source-import/extract/. /tmp/source-import/source/
          fi
          rm -rf /tmp/source-import/source/.git /tmp/source-import/source/.github
          test -f /tmp/source-import/source/application/database.php
          test -f /tmp/source-import/source/public/index.php
          test -f /tmp/source-import/source/ver.json
          grep -q '20260904' /tmp/source-import/source/ver.json
          echo 'ver.json:'
          cat /tmp/source-import/source/ver.json
          echo
          echo "source_files=$(find /tmp/source-import/source -type f | wc -l)"

      - name: Delete old repository tree and copy latest source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source-import/source/. ./

      - name: Verify replacement tree
        run: |
          set -euo pipefail
          test -d .git
          test -f ver.json
          test -f application/database.php
          test -f application/config.php
          test -f public/index.php
          test -f vendor/autoload.php
          test ! -e .github
          test ! -e .bootstrap
          test ! -e deploy.sh
          test ! -e install.sh
          test ! -e import.sql
          grep -q '20260904' ver.json
          echo "repo_files=$(find . -type f ! -path './.git/*' | wc -l)"
          du -sh .

      - name: Commit exact replacement to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'import: replace repository with latest 1.zip source'
          git push origin HEAD:main
