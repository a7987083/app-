name: Export pre-replace source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-ceshi1.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup source
        uses: actions/checkout@v4
        with:
          ref: backup/pre-20260904-replace
          fetch-depth: 1
      - name: Pack source
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/pre-replace-source.tar.gz .
          sha256sum /tmp/pre-replace-source.tar.gz
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pre-replace-source
          path: /tmp/pre-replace-source.tar.gz
          if-no-files-found: error
          retention-days: 1
