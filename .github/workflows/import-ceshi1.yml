name: Apply ceshi1 20260904 replacement

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-ceshi1.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild validated patch
        run: |
          set -euo pipefail
          cat .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 .bootstrap/part03 | base64 -d > /tmp/ceshi1_safe_patch.tgz
          echo 'a504d0d11b993ea9af07e8d3f287d559bac5fc7b082968774870ddb3e6db2f38  /tmp/ceshi1_safe_patch.tgz' | sha256sum -c -
          rm -rf /tmp/ceshi1-patch
          mkdir -p /tmp/ceshi1-patch
          tar -xzf /tmp/ceshi1_safe_patch.tgz -C /tmp/ceshi1-patch

      - name: Apply exact replacement delta
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            rm -rf -- "$path"
          done < /tmp/ceshi1-patch/delete.txt
          cp -a /tmp/ceshi1-patch/files/. ./
          rm -rf .bootstrap .github

      - name: Validate source tree
        run: |
          set -euo pipefail
          test -f ver.json
          grep -q '20260904' ver.json
          test -f application/common/library/SiteConfigSync.php
          test -f application/common/library/UpdateIntegrity.php
          test ! -e deploy.sh
          test ! -e install.sh
          test ! -e import.sql
          test ! -e .github
          test ! -e .bootstrap
          grep -q 'BT_DB_NAME' application/database.php
          grep -q 'BT_DB_USERNAME' application/database.php
          grep -q 'BT_DB_PASSWORD' application/database.php
          if grep -Eq "'password'[[:space:]]*=>[[:space:]]*'[^']+'" application/database.php && ! grep -q "'password'[[:space:]]*=>[[:space:]]*'BT_DB_PASSWORD'" application/database.php; then
            echo 'Refusing to commit a real database password'
            exit 1
          fi
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          EXPECTED_TREE='f4e758c3ecddc5abbad0e0f7c9874085bb0bb8b7'
          echo "actual_tree=$ACTUAL_TREE"
          echo "expected_tree=$EXPECTED_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"

      - name: Commit replacement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'import: replace repository with ceshi1 20260904 source'
          git push origin HEAD:main
