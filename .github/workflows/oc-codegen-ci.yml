name: OC Codegen CI

on:
  push:
    branches:
      - feature/2026092406-oc-codegen-online-update
      - feature/2026092408-dylib-center-codegen-inline
      - feature/2026092409-dylib-center-ux-simplification
      - feature/2026092410-dylib-crud-legacy-codegen
      - feature/2026092411-dylib-center-ux
      - feature/2026092412-api-integration-center
      - feature/2026092413-api-doc-full-catalog
      - 'release/**'
    paths:
      - 'application/common/library/codegen/**'
      - 'application/common/library/Ipa/DylibApiContract.php'
      - 'application/common/library/Ipa/DylibApiDocumentation.php'
      - 'application/admin/controller/general/Occodegen.php'
      - 'application/admin/controller/DylibCenter.php'
      - 'application/admin/controller/DylibCodegen.php'
      - 'application/admin/controller/DylibApiDocs.php'
      - 'application/admin/view/dylib_center/index.html'
      - 'public/assets/js/backend/dylib_center.js'
      - 'public/assets/js/backend/dylib_codegen_inline.js'
      - 'clients/ios/ZONDylibVerify/**'
      - 'release/online-update-files.txt'
      - 'release/sql/2026092407_oc_codegen.sql'
      - 'release/sql/2026092408_oc_codegen_inline.sql'
      - 'tests/oc_codegen_*'
      - 'tests/dylib_center_ux_contract_test.php'
      - 'tests/dylib_api_documentation_contract_test.php'
      - '.github/workflows/oc-codegen-ci.yml'
  workflow_dispatch:

jobs:
  php70-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: zip
      - name: Lint generator and Dylib UI
        run: |
          set -euo pipefail
          php -l application/common/library/Ipa/DylibApiContract.php
          php -l application/common/library/Ipa/DylibApiDocumentation.php
          php -l application/common/library/codegen/ObjectiveCGenerator.php
          php -l application/admin/controller/DylibCodegen.php
          php -l application/admin/controller/DylibApiDocs.php
          php -l application/admin/controller/general/Occodegen.php
          php -l application/admin/controller/DylibCenter.php
          php -l tests/oc_codegen_contract_test.php
          php -l tests/dylib_center_ux_contract_test.php
          php -l tests/dylib_api_documentation_contract_test.php
          node --check public/assets/js/backend/dylib_center.js
          node --check public/assets/js/backend/dylib_codegen_inline.js
      - name: Run Dylib codegen contract
        run: php tests/oc_codegen_contract_test.php
      - name: Run Dylib Center UX contract
        run: php tests/dylib_center_ux_contract_test.php
      - name: Run Dylib API documentation contract
        run: php tests/dylib_api_documentation_contract_test.php
      - name: Verify online-update package contains Dylib Center and codegen
        run: |
          set -euo pipefail
          php tools/build_online_update.php "$PWD/zonoe-online-update.zip"
          unzip -t zonoe-online-update.zip >/dev/null
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/common/library/Ipa/DylibApiContract.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/common/library/Ipa/DylibApiDocumentation.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/common/library/codegen/ObjectiveCGenerator.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/admin/controller/DylibCodegen.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/admin/controller/DylibApiDocs.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/admin/controller/general/Occodegen.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/admin/view/dylib_center/index.html'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/public/assets/js/backend/dylib_center.js'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/public/assets/js/backend/dylib_codegen_inline.js'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/clients/ios/ZONDylibVerify/ZONVerifyClient.h'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/clients/ios/ZONDylibVerify/ZONVerifyClient.m'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'mysql/2026092408_oc_codegen_inline.sql'
          test -s zonoe-online-update.zip.sha256

  mysql57-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zonoe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: mysqli
      - name: Verify 2407 to 2408 menu migration on MySQL 5.7
        env:
          ZONOE_MYSQL_HOST: 127.0.0.1
          ZONOE_MYSQL_PORT: 3306
          ZONOE_MYSQL_USER: root
          ZONOE_MYSQL_PASSWORD: root
          ZONOE_MYSQL_DATABASE: zonoe_test
        run: |
          set -euo pipefail
          php -l tests/oc_codegen_mysql57_migration_test.php
          php tests/oc_codegen_mysql57_migration_test.php