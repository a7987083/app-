name: OC Codegen CI

on:
  push:
    branches:
      - feature/2026092406-oc-codegen-online-update
      - 'release/**'
    paths:
      - 'application/common/library/codegen/**'
      - 'application/admin/controller/general/Occodegen.php'
      - 'application/admin/view/general/occodegen/**'
      - 'public/assets/js/backend/general/occodegen.js'
      - 'release/online-update-files.txt'
      - 'release/sql/2026092407_oc_codegen.sql'
      - 'tests/oc_codegen_*'
      - '.github/workflows/oc-codegen-ci.yml'
  workflow_dispatch:

jobs:
  php70-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: zip
      - name: Lint generator
        run: |
          set -euo pipefail
          php -l application/common/library/codegen/ObjectiveCGenerator.php
          php -l application/admin/controller/general/Occodegen.php
          php -l tests/oc_codegen_contract_test.php
          node --check public/assets/js/backend/general/occodegen.js
      - name: Run generator contract
        run: php tests/oc_codegen_contract_test.php
      - name: Verify online-update package contains generator
        run: |
          set -euo pipefail
          php tools/build_online_update.php "$PWD/zonoe-online-update.zip"
          unzip -t zonoe-online-update.zip >/dev/null
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/common/library/codegen/ObjectiveCGenerator.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/admin/controller/general/Occodegen.php'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/application/admin/view/general/occodegen/index.html'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'program/public/assets/js/backend/general/occodegen.js'
          unzip -Z1 zonoe-online-update.zip | grep -Fx 'mysql/2026092407_oc_codegen.sql'
          test -s zonoe-online-update.zip.sha256

  mysql57-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zonoe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: mysqli
      - name: Run OC generator migration twice on MySQL 5.7
        env:
          ZONOE_MYSQL_HOST: 127.0.0.1
          ZONOE_MYSQL_PORT: 3306
          ZONOE_MYSQL_USER: root
          ZONOE_MYSQL_PASSWORD: root
          ZONOE_MYSQL_DATABASE: zonoe_test
        run: |
          set -euo pipefail
          php -l tests/oc_codegen_mysql57_migration_test.php
          php tests/oc_codegen_mysql57_migration_test.php
