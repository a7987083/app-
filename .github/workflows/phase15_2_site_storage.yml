name: Phase15.2 Site Storage

on:
  push:
    branches:
      - feature/phase15-2-site-storage-v1
  pull_request:
    paths:
      - 'application/common/library/update/SiteStorageManager.php'
      - 'application/admin/controller/general/Updatemaintenance.php'
      - 'application/admin/view/general/updatemaintenance/panel.html'
      - 'public/assets/js/backend/general/updatemaintenance.js'
      - 'tests/phase15_2_site_storage_*'
      - '.github/workflows/phase15_2_site_storage.yml'

jobs:
  php70-site-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
      - name: Lint Phase15.2 files
        run: |
          set -euo pipefail
          php -l application/common/library/update/SiteStorageManager.php
          php -l application/admin/controller/general/Updatemaintenance.php
          php -l tests/phase15_2_site_storage_contract_test.php
          php -l tests/phase15_2_site_storage_runtime_test.php
          node --check public/assets/js/backend/general/updatemaintenance.js
      - name: Run Phase15.2 regressions
        run: |
          set -euo pipefail
          php tests/phase15_2_site_storage_contract_test.php
          php tests/phase15_2_site_storage_runtime_test.php
          php tests/phase14_update_ops_test.php
          php tests/phase14_update_ops_ui_contract_test.php
