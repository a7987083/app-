name: AppSource regression

on:
  push:
    branches:
      - refactor/app-source-phase1
  pull_request:

permissions:
  contents: read

jobs:
  legacy-equivalence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_image:
          - '5.6-cli'
          - '7.4-cli'
          - '8.2-cli'
    steps:
      - uses: actions/checkout@v4
      - name: Pure builder compatibility and legacy-equivalence regression
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            "php:${{ matrix.php_image }}" \
            sh -c 'php -l application/index/service/AppSourceBuilder.php && php -l tests/AppSourceBuilderRegressionTest.php && php tests/AppSourceBuilderRegressionTest.php'
      - name: Controller syntax on supported parser for existing App::list endpoint
        if: matrix.php_image != '5.6-cli'
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            "php:${{ matrix.php_image }}" \
            php -l application/index/controller/App.php
      - name: Verify PHP 5.6 incompatibility is the pre-existing App::list reserved-word issue
        if: matrix.php_image == '5.6-cli'
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:application/index/controller/App.php > .ci-baseline-App.php
          sed 's/public function list()/public function appstoreList()/' .ci-baseline-App.php > .ci-baseline-App-renamed.php
          sed 's/public function list()/public function appstoreList()/' application/index/controller/App.php > .ci-current-App-renamed.php
          docker run --rm -v "$PWD:/app" -w /app php:5.6-cli sh -c 'php -l .ci-baseline-App-renamed.php && php -l .ci-current-App-renamed.php'
          rm -f .ci-baseline-App.php .ci-baseline-App-renamed.php .ci-current-App-renamed.php
