name: AppSource regression

on:
  push:
    branches:
      - refactor/app-source-phase1
  pull_request:

permissions:
  contents: read

jobs:
  legacy-equivalence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_image:
          - '5.6-cli'
          - '7.4-cli'
          - '8.2-cli'
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and regression test
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            "php:${{ matrix.php_image }}" \
            sh -c 'php -l application/index/service/AppSourceBuilder.php && php -l application/index/controller/App.php && php -l tests/AppSourceBuilderRegressionTest.php && php tests/AppSourceBuilderRegressionTest.php'
