name: Phase 19.4 Dynamic Announcement and License Routing

on:
  push:
    branches:
      - 'feature/2026091805-phase19-4-dynamic-announcement-license'
      - 'feature/2026091808-phase19-4-x-closeout'
      - 'release/**'
      - 'hotfix/2026091806-announcement-expiry-authorization-route'
      - 'hotfix/2026091807-unified-announcement-expiry'
    paths:
      - 'application/index/controller/App.php'
      - 'application/common/library/SourceAnnouncementTemplate.php'
      - 'application/common/library/SourceServerRuntime.php'
      - 'application/common/library/SourceLegacyCache.php'
      - 'application/common/library/SourceResponse.php'
      - 'application/common/library/ApiEndpointRegistry.php'
      - 'application/admin/controller/general/Config.php'
      - 'application/admin/view/general/config/index.html'
      - 'public/assets/js/backend/general/config.js'
      - 'application/common/library/AuthorizationLicense.php'
      - 'application/index/view/index/license.html'
      - 'application/index/view/index/unbind.html'
      - 'application/route.php'
      - 'nginx.rewrite'
      - 'release/online-update-files.txt'
      - 'tests/phase19_4_dynamic_announcement_test.php'
      - 'tests/phase19_4_1_hotfix_test.php'
      - 'tests/phase19_4_2_unified_announcement_test.php'
      - 'tests/phase19_4_x_closeout_test.php'
      - 'release/sql/2026091806_announcement_priority.sql'
      - 'release/sql/2026091807_unified_announcement_expiry.sql'
      - 'release/sql/2026091808_phase19_4_x_closeout.sql'
      - 'tests/source_response_test.php'
      - 'tests/deployment_contract_test.php'
      - '.github/workflows/phase19-4-dynamic-announcement-license.yml'
  workflow_dispatch:

jobs:
  php70-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: curl, openssl, mbstring, zip

      - name: Lint Phase 19.4 runtime and UI
        run: |
          set -euo pipefail
          php -l application/common/library/SourceAnnouncementTemplate.php
          php -l application/common/library/SourceServerRuntime.php
          php -l application/common/library/ApiEndpointRegistry.php
          php -l application/common/library/SourceLegacyCache.php
          php -l application/common/library/SourceResponse.php
          php -l application/index/controller/App.php
          php -l application/admin/controller/general/Config.php
          php -l tests/phase19_4_dynamic_announcement_test.php
          php -l tests/phase19_4_1_hotfix_test.php
          php -l tests/phase19_4_2_unified_announcement_test.php
          php -l tests/phase19_4_x_closeout_test.php
          php -l tests/source_response_test.php
          php -l tests/deployment_contract_test.php
          node --check public/assets/js/backend/general/config.js

      - name: Run Phase 19.4 and legacy regression
        run: |
          set -euo pipefail
          php tests/phase19_4_dynamic_announcement_test.php
          php tests/phase19_4_1_hotfix_test.php
          php tests/phase19_4_2_unified_announcement_test.php
          php tests/phase19_4_x_closeout_test.php
          php tests/source_response_test.php
          php tests/phase19_2_legacy_response_cache_test.php
          php tests/phase19_3_1_api_center_contract_test.php
          php tests/deployment_contract_test.php
          php tests/card_access_policy_test.php
          php tests/appstore_card_scope_test.php

      - name: Verify online update coverage
        run: |
          set -euo pipefail
          grep -Fx 'application/common/library/SourceAnnouncementTemplate.php' release/online-update-files.txt
          grep -Fx 'application/common/library/SourceServerRuntime.php' release/online-update-files.txt
          grep -Fx 'application/common/library/AuthorizationLicense.php' release/online-update-files.txt
          grep -Fx 'application/index/view/index/license.html' release/online-update-files.txt
          grep -Fx 'application/index/view/index/unbind.html' release/online-update-files.txt
          grep -Fx 'nginx.rewrite' release/online-update-files.txt
          test -s release/sql/2026091808_phase19_4_x_closeout.sql
          php tools/build_online_update.php "$PWD/phase19-4-online-update.zip"
          unzip -t phase19-4-online-update.zip >/dev/null
          unzip -Z1 phase19-4-online-update.zip | grep -Fx 'program/application/common/library/SourceAnnouncementTemplate.php'
          unzip -Z1 phase19-4-online-update.zip | grep -Fx 'program/application/common/library/SourceServerRuntime.php'
          unzip -Z1 phase19-4-online-update.zip | grep -Fx 'program/application/common/library/AuthorizationLicense.php'
          unzip -Z1 phase19-4-online-update.zip | grep -Fx 'program/application/index/view/index/license.html'
          unzip -Z1 phase19-4-online-update.zip | grep -Fx 'program/application/index/view/index/unbind.html'
          unzip -Z1 phase19-4-online-update.zip | grep -Fx 'program/nginx.rewrite'
          unzip -Z1 phase19-4-online-update.zip | grep -Fx 'mysql/2026091808_phase19_4_x_closeout.sql'
