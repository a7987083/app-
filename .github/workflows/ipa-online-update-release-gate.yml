name: IPA Online Update Release Gate

on:
  push:
    branches:
      - feature/ipa-data-center-v1
      - 'release/**'
    paths:
      - 'VERSION'
      - 'public/update/ver.txt'
      - 'ver.json'
      - 'PHASE13_RELEASE.txt'
      - 'release/RELEASE_NOTES.md'
      - 'release/online-update-files.txt'
      - 'release/sql/2026092201_ipa_data_center.sql'
      - 'release/sql/2026092202_ipa_management_hotfix.sql'
      - 'release/sql/2026092203_ipa_ops_controls.sql'
      - 'release/sql/2026092204_worker_source_hotfix.sql'
      - 'release/sql/2026092205_ipa_ui_controls_hotfix.sql'
      - 'release/sql/2026092402_ipa_cleanup_controls.sql'
      - 'application/command.php'
      - 'application/admin/command/Ipa*.php'
      - 'application/admin/controller/Ipa*.php'
      - 'application/admin/view/ipa_center/**'
      - 'application/admin/view/ipa_source_center/**'
      - 'application/common/library/Ipa/**'
      - 'public/assets/js/backend/ipa_center.js'
      - 'public/assets/js/backend/ipa_source_center.js'
      - 'deploy/systemd/zonoe-ipa-parse-worker.service'
      - 'deploy/systemd/zonoe-ipa-parse-worker.timer'
      - 'tools/build_online_update.php'
      - '.github/workflows/ipa-online-update-release-gate.yml'
  workflow_dispatch:

jobs:
  online-update-package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ipa_release_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: zip,pdo_mysql

      - name: Validate release version metadata
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < VERSION)"
          test "$VERSION" = "$(tr -d '\r\n ' < public/update/ver.txt)"
          test "$VERSION" = "$(php -r '$j=json_decode(file_get_contents("ver.json"), true); echo $j["version"];')"
          test "$VERSION" = "2026092404"
          grep -F "ZONOE 软件源 ${VERSION}" release/RELEASE_NOTES.md
          grep -F "版本：${VERSION}" PHASE13_RELEASE.txt

      - name: Build the real online update package
        run: |
          set -euo pipefail
          php tools/build_online_update.php "$PWD/zonoe-online-update.zip"
          unzip -t zonoe-online-update.zip >/dev/null
          EXPECTED="$(awk '{print $1}' zonoe-online-update.zip.sha256)"
          ACTUAL="$(sha256sum zonoe-online-update.zip | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Verify 2026092404 payload
        run: |
          set -euo pipefail
          ZIP=zonoe-online-update.zip
          for f in \
            program/application/admin/controller/IpaCenter.php \
            program/application/admin/controller/IpaSourceCenter.php \
            program/application/admin/view/ipa_center/index.html \
            program/application/admin/view/ipa_source_center/index.html \
            program/application/admin/view/ipa_source_center/add.html \
            program/application/admin/view/ipa_source_center/edit.html \
            program/application/common/library/Ipa/IpaOpsSettings.php \
            program/application/common/library/Ipa/IpaSoftwareSourceService.php \
            program/application/common/library/Ipa/IpaCompareService.php \
            program/application/common/library/Ipa/IpaWorkerLauncher.php \
            program/public/assets/js/backend/ipa_center.js \
            program/public/assets/js/backend/ipa_source_center.js \
            mysql/2026092204_worker_source_hotfix.sql \
            mysql/2026092205_ipa_ui_controls_hotfix.sql \
            mysql/2026092402_ipa_cleanup_controls.sql; do
              unzip -Z1 "$ZIP" | grep -Fx "$f"
          done

      - name: Install MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client

      - name: Prepare FastAdmin auth table fixture
        run: |
          mysql -h127.0.0.1 -uroot -proot ipa_release_gate <<'SQL'
          CREATE TABLE IF NOT EXISTS fa_auth_rule (
            id int unsigned NOT NULL AUTO_INCREMENT,
            type enum('menu','file') NOT NULL DEFAULT 'file',
            pid int unsigned NOT NULL DEFAULT 0,
            name varchar(100) NOT NULL DEFAULT '',
            title varchar(50) NOT NULL DEFAULT '',
            icon varchar(50) NOT NULL DEFAULT '',
            `condition` varchar(255) NOT NULL DEFAULT '',
            remark varchar(255) NOT NULL DEFAULT '',
            ismenu tinyint unsigned NOT NULL DEFAULT 0,
            createtime int DEFAULT NULL,
            updatetime int DEFAULT NULL,
            weigh int NOT NULL DEFAULT 0,
            status varchar(30) NOT NULL DEFAULT '',
            PRIMARY KEY (id), UNIQUE KEY name (name), KEY pid (pid), KEY weigh (weigh)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8;
          SQL

      - name: Prepare 2026092204 installed state
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -proot ipa_release_gate < release/sql/2026092201_ipa_data_center.sql
          mysql -h127.0.0.1 -uroot -proot ipa_release_gate < release/sql/2026092202_ipa_management_hotfix.sql
          mysql -h127.0.0.1 -uroot -proot ipa_release_gate < release/sql/2026092203_ipa_ops_controls.sql
          mysql -h127.0.0.1 -uroot -proot ipa_release_gate < release/sql/2026092204_worker_source_hotfix.sql
          test "$(mysql -N -B -h127.0.0.1 -uroot -proot ipa_release_gate -e "SELECT COUNT(*) FROM fa_auth_rule WHERE name='ipa_source_center/add'")" = "1"
          test "$(mysql -N -B -h127.0.0.1 -uroot -proot ipa_release_gate -e "SELECT COUNT(*) FROM fa_auth_rule WHERE name='ipa_source_center/del'")" = "1"

      - name: Apply IPA UI migrations twice on MySQL 5.7
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -proot ipa_release_gate < release/sql/2026092205_ipa_ui_controls_hotfix.sql
          mysql -h127.0.0.1 -uroot -proot ipa_release_gate < release/sql/2026092205_ipa_ui_controls_hotfix.sql
          mysql -h127.0.0.1 -uroot -proot ipa_release_gate < release/sql/2026092402_ipa_cleanup_controls.sql
          mysql -h127.0.0.1 -uroot -proot ipa_release_gate < release/sql/2026092402_ipa_cleanup_controls.sql
          for rule in \
            ipa_center/saveParseSettings \
            ipa_center/pauseParse \
            ipa_center/resumeParse \
            ipa_center/clearParseResults \
            ipa_center/deleteSource \
            ipa_center/forceDeleteSource \
            ipa_center/retryParse \
            ipa_center/assetDetail \
            ipa_center/compareAsset \
            ipa_center/applyCompareWriteback \
            ipa_center/clearScanJobs \
            ipa_center/deleteAsset \
            ipa_center/clearAssets; do
            test "$(mysql -N -B -h127.0.0.1 -uroot -proot ipa_release_gate -e "SELECT COUNT(*) FROM fa_auth_rule WHERE name='$rule'")" = "1"
          done

      - name: Verify PHP 7.0 runtime contracts
        run: |
          set -euo pipefail
          php -l application/admin/controller/IpaCenter.php
          php -l application/admin/controller/IpaSourceCenter.php
          php -l application/admin/command/IpaWorker.php
          php -l application/admin/command/IpaParseWorker.php
          php -l application/common/library/Ipa/IpaOpsSettings.php
          php -l application/common/library/Ipa/IpaSoftwareSourceService.php
          php -l application/common/library/Ipa/IpaCompareService.php
          php -l application/common/library/Ipa/IpaScanService.php
          php -l application/common/library/Ipa/IpaWorkerLauncher.php
          php -l application/common/library/Ipa/OpenListClient.php
          php -l application/common/library/Ipa/IpaParserService.php
          php -l application/common/library/Ipa/RemoteZipReader.php
          php tests/macho_inspector_contract.php
          php tests/macho_inspector_fat_contract.php
          php tests/macho_inspector_parser_contract.php
          node --check public/assets/js/backend/ipa_center.js
          grep -q 'btn-parse-toggle' application/admin/view/ipa_center/index.html
          grep -q 'btn-clear-parse-results' application/admin/view/ipa_center/index.html
          grep -q 'btn-clear-scan-jobs' application/admin/view/ipa_center/index.html
          grep -q 'btn-clear-assets' application/admin/view/ipa_center/index.html
          grep -q 'source-disabled' application/admin/view/ipa_center/index.html
          grep -q 'clearScanJobs' application/admin/controller/IpaCenter.php
          grep -q 'deleteAsset' application/admin/controller/IpaCenter.php
          grep -q 'clearAssets' application/admin/controller/IpaCenter.php
          grep -q 'IpaWorkerLauncher::ensureScanWorker' application/common/library/Ipa/IpaScanService.php
          grep -q 'IpaWorkerLauncher::ensureParseWorker' application/common/library/Ipa/IpaOpsSettings.php
          grep -q 'ensureParseWorker' application/common/library/Ipa/IpaWorkerLauncher.php
          grep -q 'drainParseQueue' application/common/library/Ipa/IpaWorkerLauncher.php
          grep -q 'register_shutdown_function' application/common/library/Ipa/IpaWorkerLauncher.php
          grep -q 'fastcgi_finish_request' application/common/library/Ipa/IpaWorkerLauncher.php
          if grep -Eq 'proc_open|nohup|PHP_BINDIR|/dev/null' application/common/library/Ipa/IpaWorkerLauncher.php; then exit 1; fi
          grep -q 'btn-ipa-refresh' public/assets/js/backend/ipa_center.js
          grep -q 'setInterval' public/assets/js/backend/ipa_center.js
          grep -q 'stopPropagation' public/assets/js/backend/ipa_source_center.js
          php think list | grep -q 'ipa:worker'
          php think list | grep -q 'ipa:parse-worker'
          php think list | grep -q 'ipa:maintenance'
