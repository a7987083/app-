name: Phase14.2 Failure Injection

on:
  push:
    branches:
      - feature/phase14-2-failure-injection-v1
  pull_request:
    paths:
      - 'application/common/library/update/UpdateInstaller.php'
      - 'tests/phase14_2_failure_injection_test.php'
      - '.github/workflows/phase14-2-failure-injection.yml'

jobs:
  php70-failure-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          extensions: zip

      - name: Lint Phase14.2 files
        run: |
          set -euo pipefail
          php -l application/common/library/update/UpdateInstaller.php
          php -l tests/phase14_2_failure_injection_test.php

      - name: Run failure-injection regression
        run: |
          set -euo pipefail
          php tests/phase14_2_failure_injection_test.php

      - name: Re-run updater regression
        run: |
          set -euo pipefail
          php tests/phase12_update_contract_test.php
          php tests/phase13_update_runtime_test.php
          php tests/phase14_update_atomicity_test.php
