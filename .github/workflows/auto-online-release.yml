name: Auto Online Release Gate

on:
  push:
    branches:
      - 'feature/20*'
      - 'release/**'

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-online-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Load automatic-release policy
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          test -s release/auto-release.env
          # shellcheck disable=SC1091
          source release/auto-release.env
          test "${AUTO_RELEASE:-0}" = "1"
          VERSION_VALUE="$(tr -d '\r\n ' < VERSION)"
          TXT_VERSION="$(tr -d '\r\n ' < public/update/ver.txt)"
          JSON_VERSION="$(php -r '$j=json_decode(file_get_contents("ver.json"), true); echo isset($j["version"]) ? $j["version"] : "";')"
          [[ "$VERSION_VALUE" =~ ^20[0-9]{6,12}$ ]]
          test "$VERSION_VALUE" = "$TXT_VERSION"
          test "$VERSION_VALUE" = "$JSON_VERSION"
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG_PREFIX:-source-v}$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "workflow=${RELEASE_WORKFLOW:-phase13_github_release.yml}" >> "$GITHUB_OUTPUT"

      - name: Wait for every sibling CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Give push-triggered workflows time to enter the Actions queue.
          sleep 12
          quiet_passes=0
          for attempt in $(seq 1 180); do
            JSON="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")"

            STATE="$(printf '%s' "$JSON" | php -r '
              $j=json_decode(stream_get_contents(STDIN), true);
              $current=(string)getenv("CURRENT_RUN_ID");
              $pending=[]; $failed=[]; $seen=0;
              foreach (($j["workflow_runs"] ?? []) as $run) {
                  if ((string)($run["id"] ?? "") === $current) continue;
                  $seen++;
                  $status=(string)($run["status"] ?? "");
                  $conclusion=(string)($run["conclusion"] ?? "");
                  $name=(string)($run["name"] ?? "workflow");
                  if ($status !== "completed") { $pending[]=$name . ":" . $status; continue; }
                  if (!in_array($conclusion, ["success","skipped","neutral"], true)) {
                      $failed[]=$name . ":" . $conclusion;
                  }
              }
              if ($failed) { echo "FAILED|" . implode(",", $failed); }
              elseif ($pending) { echo "PENDING|" . implode(",", $pending); }
              else { echo "READY|" . $seen; }
            ')"

            case "$STATE" in
              FAILED\|*)
                echo "Sibling CI failed: ${STATE#FAILED|}" >&2
                exit 1
                ;;
              PENDING\|*)
                quiet_passes=0
                echo "Waiting for CI: ${STATE#PENDING|}"
                ;;
              READY\|*)
                quiet_passes=$((quiet_passes + 1))
                echo "All sibling CI completed successfully (quiet pass ${quiet_passes}/2, sibling runs ${STATE#READY|})."
                if [ "$quiet_passes" -ge 2 ]; then
                  exit 0
                fi
                ;;
            esac
            sleep 10
          done
          echo 'Timed out waiting for sibling CI workflows.' >&2
          exit 1

      - name: Check whether this version is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.policy.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          if [ "$CODE" = "200" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} already exists; no duplicate release is created."
          elif [ "$CODE" = "404" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/release.json || true
            echo "Unexpected GitHub release lookup HTTP ${CODE}" >&2
            exit 1
          fi

      - name: Dispatch canonical ZONOE Source Release
        if: steps.existing.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW: ${{ steps.policy.outputs.workflow }}
          RELEASE_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(printf '{\"ref\":\"%s\"}' "$RELEASE_REF")"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${RELEASE_WORKFLOW}/dispatches" \
            -d "$PAYLOAD"
          echo "Dispatched ${RELEASE_WORKFLOW} for tested ref ${RELEASE_REF}."
