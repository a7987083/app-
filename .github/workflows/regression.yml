name: Regression Checks

on:
  push:
    branches:
      - dev/software-source-v1
  pull_request:

jobs:
  php-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.0', '8.2', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint changed application PHP
        run: |
          php -l application/common/library/AppStorePayload.php
          php -l application/common/library/SourceAppRecord.php
          php -l application/common/library/SourceHttpClient.php
          php -l application/common/library/SourceResponse.php
          php -l application/common/library/SourceConfigRepository.php
          php -l application/common/library/BlacklistPolicy.php
          php -l application/common/library/TraceMonitorPolicy.php
          php -l application/common/library/CategoryDailyStat.php
          php -l application/common/library/CardCodeGenerator.php
          php -l application/common/library/CardEntitlementPolicy.php
          php -l application/common/library/CardDeviceTransfer.php
          php -l application/common/model/Config.php
          php -l application/index/controller/App.php
          php -l application/index/controller/Index.php
          php -l application/admin/controller/Category.php
          php -l application/admin/controller/Monitor.php
          php -l application/admin/controller/Kami.php
          php -l application/admin/controller/Black.php
          php -l application/admin/model/Black.php
          php -l application/admin/model/Kami.php
          php -l tests/appstore_payload_test.php
          php -l tests/appstore_equivalence_test.php
          php -l tests/appstore_semantic_equivalence_test.php
          php -l tests/source_app_record_test.php
          php -l tests/source_http_client_contract_test.php
          php -l tests/source_response_test.php
          php -l tests/source_config_repository_test.php
          php -l tests/blacklist_policy_test.php
          php -l tests/blacklist_persistence_contract_test.php
          php -l tests/blacklist_maintenance_test.php
          php -l tests/trace_monitor_policy_test.php
          php -l tests/trace_monitor_contract_test.php
          php -l tests/category_listing_contract_test.php
          php -l tests/category_daily_stat_test.php
          php -l tests/category_statistics_contract_test.php
          php -l tests/card_code_generator_test.php
          php -l tests/card_maintenance_contract_test.php
          php -l tests/card_entitlement_policy_test.php
          php -l tests/card_device_transfer_contract_test.php
          php -l tests/phase10_controller_contract_test.php
          php -l tests/legacy_controller_contract_test.php
          php -l tests/deployment_contract_test.php
          bash -n tools/trace_monitor_probe.sh
          bash -n tools/legacy_controller_access_audit.sh
          bash -n tests/legacy_controller_audit_test.sh

      - name: Run appstore, category, card, trace-monitor, blacklist and deployment regression tests
        run: |
          php tests/appstore_payload_test.php
          php tests/appstore_equivalence_test.php
          php tests/appstore_semantic_equivalence_test.php
          php tests/source_app_record_test.php
          php tests/source_http_client_contract_test.php
          php tests/source_response_test.php
          php tests/source_config_repository_test.php
          php tests/blacklist_policy_test.php
          php tests/blacklist_persistence_contract_test.php
          php tests/blacklist_maintenance_test.php
          php tests/trace_monitor_policy_test.php
          php tests/trace_monitor_contract_test.php
          php tests/category_listing_contract_test.php
          php tests/category_daily_stat_test.php
          php tests/category_statistics_contract_test.php
          php tests/card_code_generator_test.php
          php tests/card_maintenance_contract_test.php
          php tests/card_entitlement_policy_test.php
          php tests/card_device_transfer_contract_test.php
          php tests/phase10_controller_contract_test.php
          php tests/legacy_controller_contract_test.php
          bash tests/legacy_controller_audit_test.sh
          php tests/deployment_contract_test.php

  package-release:
    if: github.event_name == 'push'
    needs: php-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate BaoTa release contract
        run: |
          set -euo pipefail
          test -f auto_install.json
          test -f import.sql
          test -f nginx.rewrite
          test -f application/common/library/SourceAppRecord.php
          test -f application/common/library/SourceHttpClient.php
          test -f application/common/library/SourceResponse.php
          test -f application/common/library/CardEntitlementPolicy.php
          test -f application/common/library/CardDeviceTransfer.php
          test -f application/index/view/index/unbind.html
          test ! -e application/index/controller/App-mb.php
          test ! -e application/index/controller/Index2.php
          grep -F "Route::rule('unbind','index/Index/unbind');" application/route.php
          grep -F 'BT_DB_NAME' application/database.php
          grep -F 'BT_DB_USERNAME' application/database.php
          grep -F 'BT_DB_PASSWORD' application/database.php
          grep -F 'SOURCE_HTTP_VERIFY_TLS' application/common/library/SourceHttpClient.php
          grep -F 'CardEntitlementPolicy::activationState' application/index/controller/App.php
          grep -F 'CardDeviceTransfer::transfer' application/index/controller/Index.php

      - name: Build BaoTa deployment ZIP
        run: |
          set -euo pipefail
          zip -qr zonoe-source-phase10-bt.zip . \
            -x '.git/*' \
               'zonoe-source-phase10-bt.zip' \
               'zonoe-source-phase10-bt.zip.sha256'
          sha256sum zonoe-source-phase10-bt.zip > zonoe-source-phase10-bt.zip.sha256
          unzip -t zonoe-source-phase10-bt.zip >/dev/null

      - name: Upload BaoTa release artifact
        uses: actions/upload-artifact@v4
        with:
          name: zonoe-source-phase10-bt
          path: |
            zonoe-source-phase10-bt.zip
            zonoe-source-phase10-bt.zip.sha256
          if-no-files-found: error
          retention-days: 30
