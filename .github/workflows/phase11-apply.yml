name: Phase11 Apply

on:
  push:
    branches:
      - dev/software-source-v1

permissions:
  contents: write

jobs:
  apply-phase11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/software-source-v1
          fetch-depth: 1

      - name: Apply validated Phase 11 patch
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G 'tools/phase11_chunk_*.txt' > /dev/null; then
            echo 'Phase 11 patch chunks already consumed; nothing to apply.'
            exit 0
          fi
          cat tools/phase11_chunk_*.txt > /tmp/phase11.b64
          base64 -d /tmp/phase11.b64 | gzip -d > /tmp/phase11.patch
          git apply --exclude='.github/workflows/regression.yml' --check /tmp/phase11.patch
          git apply --exclude='.github/workflows/regression.yml' /tmp/phase11.patch
          rm -f tools/phase11_repo.patch.gz.b64 tools/phase11_chunk_*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "phase11: authorization operations and transfer controls"
          git push origin HEAD:dev/software-source-v1
