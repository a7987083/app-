name: Phase11 Apply

on:
  push:
    branches:
      - dev/software-source-v1

permissions:
  contents: write

jobs:
  apply-phase11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/software-source-v1
          fetch-depth: 1

      - name: Apply validated Phase 11 patch
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/phase11_repo.patch.gz.b64
          base64 -d tools/phase11_repo.patch.gz.b64 | gzip -d > /tmp/phase11.patch
          git apply --check /tmp/phase11.patch
          git apply /tmp/phase11.patch
          rm -f tools/phase11_repo.patch.gz.b64
          rm -f .github/workflows/phase11-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "phase11: authorization operations and transfer controls"
          git push origin HEAD:dev/software-source-v1
