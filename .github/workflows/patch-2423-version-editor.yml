name: Patch 2423 Version Editor

on:
  push:
    branches:
      - feature/2026092423-version-editor-full-fields

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/2026092423-version-editor-full-fields
          fetch-depth: 1
      - name: Apply patch
        run: python3 .github/scripts/patch_2423_version_editor.py
      - name: Validate patched JavaScript
        run: |
          node --check public/assets/js/backend/dylib_center.js
          grep -F 'collectVersionPayload' public/assets/js/backend/dylib_center.js
          grep -F '离线可用（秒）' public/assets/js/backend/dylib_center.js
          grep -F '请填写版本号。' public/assets/js/backend/dylib_center.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/js/backend/dylib_center.js
          git commit -m 'fix(2423): complete version editor and stabilize add payload'
          git push origin HEAD:feature/2026092423-version-editor-full-fields
