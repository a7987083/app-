name: Phase14.3 Update Operations

on:
  push:
    branches:
      - feature/phase14-3-update-ops-v2
      - feature/2026092414-ops-backup-log-cleanup
      - feature/2026092415-remove-rollback-protection
  pull_request:
    paths:
      - 'application/common/library/update/UpdateOps.php'
      - 'application/common/library/update/UpdateBackupManager.php'
      - 'application/admin/controller/general/Updatemaintenance.php'
      - 'application/admin/controller/general/Apilogmaintenance.php'
      - 'application/admin/view/general/updatemaintenance/panel.html'
      - 'application/admin/view/common/script.html'
      - 'public/assets/js/backend/general/updatemaintenance.js'
      - 'public/assets/js/backend/general/config.js'
      - 'tests/phase14_update_ops_test.php'
      - 'tests/phase14_update_ops_ui_contract_test.php'
      - 'tests/phase2414_ops_backup_log_cleanup_contract_test.php'
      - 'release/auto-release.env'
      - 'RELEASE_POLICY.md'
      - '.github/workflows/phase14-update-ops.yml'

jobs:
  php70-update-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none

      - name: Lint Phase14.3 and 2414 files
        run: |
          set -euo pipefail
          php -l application/common/library/update/UpdateOps.php
          php -l application/common/library/update/UpdateBackupManager.php
          php -l application/admin/controller/general/Updatemaintenance.php
          php -l application/admin/controller/general/Apilogmaintenance.php
          php -l tests/phase14_update_ops_test.php
          php -l tests/phase14_update_ops_ui_contract_test.php
          php -l tests/phase2414_ops_backup_log_cleanup_contract_test.php
          node --check public/assets/js/backend/general/updatemaintenance.js
          node --check public/assets/js/backend/general/config.js

      - name: Run update operations regression
        run: |
          set -euo pipefail
          php tests/phase14_update_ops_test.php
          php tests/phase14_update_ops_ui_contract_test.php
          php tests/phase2414_ops_backup_log_cleanup_contract_test.php

      - name: Re-run updater hardening regression
        run: |
          set -euo pipefail
          php tests/phase14_2_failure_injection_test.php
          php tests/phase13_update_runtime_test.php
          php tests/phase14_update_atomicity_test.php
