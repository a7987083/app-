name: IPA Parser V2 2427 Migration CI

on:
  push:
    branches:
      - feature/2026092427-ipa-parser-ipaxiazaizhan-migration
  pull_request:
    paths:
      - 'application/admin/command/IpaParseWorker.php'
      - 'application/common/library/Ipa/IpaParserService.php'
      - 'application/common/library/Ipa/IpaParserV2Service.php'
      - 'application/common/library/Ipa/IpaWorkerLauncher.php'
      - 'application/common/library/Ipa/IpaOpsSettings.php'
      - 'application/common/library/Ipa/IpaScanService.php'
      - 'application/common/library/Ipa/OpenListClient.php'
      - 'application/common/library/Ipa/HttpRangeClient.php'
      - 'application/common/library/Ipa/RemoteZipReader.php'
      - 'application/common/library/Ipa/PlistDecoder.php'
      - 'tests/ipa_range_parser_contract.php'
      - '.github/workflows/ipa-parser-v2-2427-ci.yml'
      - 'VERSION'

jobs:
  parser-v2-2427-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          extensions: curl, mbstring
          coverage: none

      - name: PHP 7.0 syntax
        run: |
          set -euo pipefail
          php -v
          php -l application/admin/command/IpaParseWorker.php
          php -l application/common/library/Ipa/IpaParserService.php
          php -l application/common/library/Ipa/IpaParserV2Service.php
          php -l application/common/library/Ipa/IpaWorkerLauncher.php
          php -l application/common/library/Ipa/IpaOpsSettings.php
          php -l application/common/library/Ipa/IpaScanService.php
          php -l application/common/library/Ipa/OpenListClient.php
          php -l application/common/library/Ipa/HttpRangeClient.php
          php -l application/common/library/Ipa/RemoteZipReader.php
          php -l application/common/library/Ipa/PlistDecoder.php

      - name: Application-triggered parser contracts
        run: |
          set -euo pipefail
          grep -q 'function ensureParseWorker' application/common/library/Ipa/IpaWorkerLauncher.php
          grep -q 'ipa:parse-worker --scheduled' application/common/library/Ipa/IpaWorkerLauncher.php
          grep -q 'self::ensureParseWorker' application/common/library/Ipa/IpaWorkerLauncher.php
          grep -q 'exec_disabled' application/common/library/Ipa/IpaWorkerLauncher.php
          ! grep -q "status' => 'cli_only" application/common/library/Ipa/IpaWorkerLauncher.php

      - name: ipaxiazaizhan migration contracts
        run: |
          set -euo pipefail
          grep -q 'DIRECTORY_CACHE_TTL = 1800' application/common/library/Ipa/OpenListClient.php
          grep -q 'ipa-directory-cache' application/common/library/Ipa/OpenListClient.php
          grep -q 'DEFAULT_BLOCK_BYTES = 262144' application/common/library/Ipa/HttpRangeClient.php
          grep -q 'DEFAULT_TOTAL_BUDGET = 16777216' application/common/library/Ipa/HttpRangeClient.php
          grep -q 'cached_blocks' application/common/library/Ipa/HttpRangeClient.php
          grep -q 'contentFingerprint' application/common/library/Ipa/IpaScanService.php
          grep -q 'reuseParsedMetadata' application/common/library/Ipa/IpaParserV2Service.php
          grep -q 'reused_by_md5' application/common/library/Ipa/IpaParserV2Service.php
          grep -q 'parse_failed' application/admin/command/IpaParseWorker.php
          grep -Eq '1800|30 ?\* ?60' application/admin/command/IpaParseWorker.php application/common/library/Ipa/IpaOpsSettings.php

      - name: Bounded scheduling and full-scan freshness contracts
        run: |
          set -euo pipefail
          grep -q "addOption('limit'" application/admin/command/IpaParseWorker.php
          grep -q 'min(20' application/admin/command/IpaParseWorker.php
          grep -q 'scheduledLimit' application/admin/command/IpaParseWorker.php
          grep -q "mode.*===.*'full'" application/common/library/Ipa/IpaScanService.php
          grep -q 'listDirectory.*forceRefresh' application/common/library/Ipa/IpaScanService.php

      - name: Fast Info.plist-only parser contracts
        run: |
          set -euo pipefail
          grep -q 'Payload/' application/common/library/Ipa/IpaParserV2Service.php
          grep -q 'PLIST_MAX_BYTES' application/common/library/Ipa/IpaParserV2Service.php
          ! grep -q 'MachOInspector' application/common/library/Ipa/IpaParserV2Service.php
          ! grep -q 'IpaCompareService' application/common/library/Ipa/IpaParserV2Service.php
          ! grep -q 'IpaCompareService' application/admin/command/IpaParseWorker.php

      - name: Range ZIP and plist regression
        run: php tests/ipa_range_parser_contract.php

      - name: CLI registration
        run: |
          set -euo pipefail
          chmod +x think
          php think list | tee /tmp/think-list.txt
          grep -q 'ipa:parse-worker' /tmp/think-list.txt
