name: IPA Data Center CI

on:
  push:
    branches:
      - feature/ipa-data-center-v1
  pull_request:
    paths:
      - 'application/admin/controller/IpaCenter.php'
      - 'application/admin/controller/DylibCenter.php'
      - 'application/admin/command/IpaWorker.php'
      - 'application/admin/command/IpaParseWorker.php'
      - 'application/admin/command/IpaMaintenance.php'
      - 'application/common/library/Ipa/**'
      - 'application/index/controller/DylibVerify.php'
      - 'application/extra/ipa_data_center.php'
      - 'application/admin/view/ipa_center/**'
      - 'application/admin/view/dylib_center/**'
      - 'public/assets/js/backend/ipa_center.js'
      - 'public/assets/js/backend/dylib_center.js'
      - 'database/ipa_data_center_*.sql'
      - 'clients/ios/ZONDylibVerify/**'
      - 'deploy/systemd/**'
      - 'tests/**'

jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -v
          php -l application/admin/controller/IpaCenter.php
          php -l application/admin/controller/DylibCenter.php
          php -l application/admin/command/IpaWorker.php
          php -l application/admin/command/IpaParseWorker.php
          php -l application/admin/command/IpaMaintenance.php
          for f in application/common/library/Ipa/*.php; do php -l "$f"; done
          php -l application/index/controller/DylibVerify.php
          php -l application/extra/ipa_data_center.php
          for f in tests/*.php; do php -l "$f"; done
      - name: Build binary plist fixture
        run: |
          python3 - <<'PY'
          import plistlib
          with open('/tmp/ipa_binary_plist_fixture.bin', 'wb') as f:
              plistlib.dump({'CFBundleIdentifier':'com.example.binary','CFBundleVersion':'57'}, f, fmt=plistlib.FMT_BINARY)
          PY
      - name: Range ZIP and plist contracts
        run: php tests/ipa_range_parser_contract.php
      - name: Mach-O inspector contracts
        run: |
          php tests/macho_inspector_contract.php
          php tests/macho_inspector_fat_contract.php
          php tests/macho_inspector_parser_contract.php
      - name: Dylib signing contract
        run: php tests/dylib_signing_contract.php
      - name: OpenList HTTP integration
        run: |
          php -S 127.0.0.1:18081 tests/openlist_mock_router.php >/tmp/openlist-mock.log 2>&1 &
          echo $! >/tmp/openlist-mock.pid
          trap 'kill $(cat /tmp/openlist-mock.pid) 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:18081/; then break; fi
            sleep 0.25
          done
          php tests/openlist_client_integration.php
      - name: MySQL 5.7 schema integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE ipa_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci"
          mysql -h127.0.0.1 -uroot -proot ipa_ci < database/ipa_data_center_v1.sql
          mysql -h127.0.0.1 -uroot -proot ipa_ci < database/ipa_data_center_v1_1_request_signing.sql
          mysql -h127.0.0.1 -uroot -proot ipa_ci < database/ipa_data_center_v1_1_request_signing.sql
          mysql -h127.0.0.1 -uroot -proot ipa_ci < database/ipa_data_center_v1_2_worker_state.sql
          mysql -h127.0.0.1 -uroot -proot ipa_ci < database/ipa_data_center_v1_2_worker_state.sql
          test "$(mysql -N -B -h127.0.0.1 -uroot -proot -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='ipa_ci' AND TABLE_NAME LIKE 'fa_ipa_%'" )" -ge 7
          test "$(mysql -N -B -h127.0.0.1 -uroot -proot -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='ipa_ci' AND TABLE_NAME='fa_dylib' AND COLUMN_NAME='verify_secret_ciphertext'" )" = "1"
          test "$(mysql -N -B -h127.0.0.1 -uroot -proot ipa_ci -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='ipa_ci' AND TABLE_NAME='fa_ipa_worker_state'" )" = "1"
      - name: MySQL 5.7 worker claim contention
        run: |
          mysql -h127.0.0.1 -uroot -proot ipa_ci < tests/worker_claim_concurrency.sql
          cat > /tmp/claim.sql <<'SQL'
          START TRANSACTION;
          SELECT id INTO @id FROM fa_ipa_scan_item WHERE status='pending' ORDER BY id ASC LIMIT 1 FOR UPDATE;
          UPDATE fa_ipa_scan_item SET status='processing', worker_id=@worker, locked_at=UNIX_TIMESTAMP() WHERE id=@id AND status='pending';
          COMMIT;
          SELECT @id;
          SQL
          (mysql -N -B -h127.0.0.1 -uroot -proot ipa_ci --init-command="SET @worker='w1'" < /tmp/claim.sql > /tmp/claim1.out) &
          P1=$!
          (mysql -N -B -h127.0.0.1 -uroot -proot ipa_ci --init-command="SET @worker='w2'" < /tmp/claim.sql > /tmp/claim2.out) &
          P2=$!
          wait $P1
          wait $P2
          cat /tmp/claim1.out /tmp/claim2.out
          test "$(sort -u /tmp/claim1.out /tmp/claim2.out | wc -l | tr -d ' ')" = "2"
          test "$(mysql -N -B -h127.0.0.1 -uroot -proot ipa_ci -e "SELECT COUNT(*) FROM fa_ipa_scan_item WHERE status='processing'")" = "2"
      - name: MySQL 5.7 100k scale integration
        run: |
          START=$(date +%s)
          mysql -h127.0.0.1 -uroot -proot ipa_ci < tests/mysql_100k_scale.sql | tee /tmp/mysql-100k.out
          ELAPSED=$(( $(date +%s) - START ))
          echo "100k fixture elapsed=${ELAPSED}s"
          test "$(mysql -N -B -h127.0.0.1 -uroot -proot ipa_ci -e "SELECT COUNT(*) FROM fa_ipa_asset")" = "100000"
          test "$(mysql -N -B -h127.0.0.1 -uroot -proot ipa_ci -e "SELECT COUNT(*) FROM fa_ipa_asset WHERE status='parse_failed'")" = "5000"
          test "$(mysql -N -B -h127.0.0.1 -uroot -proot ipa_ci -e "SELECT COUNT(*) FROM fa_ipa_asset WHERE bundle_id='com.scale.game99999'")" = "1"
          test "$ELAPSED" -le 60
          mysql -h127.0.0.1 -uroot -proot -e "DROP DATABASE ipa_ci"
      - name: Baseline isolation contracts
        run: |
          test -f database/ipa_data_center_v1.sql
          test -f database/ipa_data_center_menu_v1.sql
          test -f database/ipa_data_center_v1_1_request_signing.sql
          test -f database/ipa_data_center_v1_2_worker_state.sql
          grep -q "default_offline_grace.*900" database/ipa_data_center_v1.sql
          grep -q "verify_secret_ciphertext" database/ipa_data_center_v1.sql
          grep -q "source-v2026091809" docs/IPA_DATA_CENTER_ARCHITECTURE.md
          ! grep -q "IpaCenter" application/admin/controller/Category.php
          ! grep -q "DylibCenter" application/admin/controller/Category.php
      - name: Manual-only category write-back contract
        run: |
          test "$(grep -R -l "Db::name('category').*update" application/common/library/Ipa application/admin/controller/IpaCenter.php || true)" = "application/common/library/Ipa/IpaWritebackService.php"
          ! grep -R "IpaWritebackService::apply" application/admin/command application/common/library/Ipa/IpaScanService.php application/common/library/Ipa/IpaParserService.php
      - name: Dylib security contracts
        run: |
          grep -q "signature_mismatch" application/common/library/Ipa/DylibVerificationService.php
          grep -q "Only authenticated requests may reserve a nonce" application/common/library/Ipa/DylibVerificationService.php
          grep -q "kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly" clients/ios/ZONDylibVerify/ZONVerifyClient.m
          grep -q "offline_grace" clients/ios/ZONDylibVerify/ZONVerifyClient.m
      - name: Scan service safety contracts
        run: |
          grep -q "Encrypted OpenList token requires a token resolver" application/common/library/Ipa/IpaScanService.php
          grep -q "listDirectory(\$item\['path'\], \$page, \$pageSize, false)" application/common/library/Ipa/IpaScanService.php
          ! grep -q "Foundation fallback only" application/common/library/Ipa/IpaScanService.php
      - name: Management and memory safety contracts
        run: |
          grep -q "function deleteSource" application/admin/controller/IpaCenter.php
          grep -q "function retryParse" application/admin/controller/IpaCenter.php
          grep -q "function extractPrefix" application/common/library/Ipa/RemoteZipReader.php
          grep -q "binaryHeaderLimit" application/common/library/Ipa/IpaParserService.php
          grep -q "WorkerState::heartbeat('scan'" application/admin/command/IpaWorker.php
          grep -q "WorkerState::heartbeat('parse'" application/admin/command/IpaParseWorker.php
          grep -q "btn-source-delete" public/assets/js/backend/ipa_center.js
          grep -q "btn-source-edit" public/assets/js/backend/ipa_center.js
          grep -q "btn-parse-retry" public/assets/js/backend/ipa_center.js
      - name: Operations contracts
        run: |
          grep -q "IpaMaintenance" application/command.php
          grep -q "ipa:worker" deploy/systemd/zonoe-ipa-worker.service
          grep -q "ipa:parse-worker" deploy/systemd/zonoe-ipa-parse-worker.service
          grep -q "ipa:maintenance" deploy/systemd/zonoe-ipa-maintenance.service
          grep -q "OnCalendar" deploy/systemd/zonoe-ipa-maintenance.timer

  php70-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 7.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          extensions: curl, openssl, mbstring
          coverage: none
      - name: PHP 7.0 syntax and contracts
        run: |
          php -v
          for f in application/admin/controller/IpaCenter.php application/admin/controller/DylibCenter.php application/admin/command/IpaWorker.php application/admin/command/IpaParseWorker.php application/admin/command/IpaMaintenance.php application/common/library/Ipa/*.php application/index/controller/DylibVerify.php application/extra/ipa_data_center.php tests/ipa_range_parser_contract.php tests/macho_inspector_contract.php tests/macho_inspector_fat_contract.php tests/macho_inspector_parser_contract.php tests/dylib_signing_contract.php tests/openlist_client_integration.php tests/openlist_mock_router.php; do php -l "$f"; done
          php -r 'exit(function_exists("inflate_init") && function_exists("inflate_add") ? 0 : 1);'
          php tests/dylib_signing_contract.php
          php tests/macho_inspector_contract.php
          php tests/macho_inspector_fat_contract.php
          php tests/macho_inspector_parser_contract.php
      - name: ThinkPHP CLI command registration on target runtime
        run: |
          chmod +x think
          php think list | tee /tmp/think-list.txt
          grep -q "ipa:worker" /tmp/think-list.txt
          grep -q "ipa:parse-worker" /tmp/think-list.txt
          grep -q "ipa:maintenance" /tmp/think-list.txt

  ios-sdk-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile verifier with iPhoneOS SDK for arm64
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -fobjc-arc \
            -miphoneos-version-min=12.0 \
            -isysroot "$SDK" \
            -c clients/ios/ZONDylibVerify/ZONVerifyClient.m \
            -o /tmp/ZONVerifyClient.o
          file /tmp/ZONVerifyClient.o
